<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3T Detay - Mera İzleme Sistemi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/assets/css/layout.css?v=12" rel="stylesheet" />
  <style>
    .ek3a-madde { font-size: 13px; padding: .2rem 0; }
    /* ---- Sağ sütun: süreç ağacı ---- */
    .ana-adim-blok { margin-bottom: 1rem; }
    .ana-adim-baslik { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: #4a6358; text-transform: uppercase; letter-spacing: .02em; padding: .3rem .1rem; }
    .ana-adim-ilerleme { font-size: 11px; font-weight: 500; color: #8a978f; }
    .alt-adim-satiri { display: flex; align-items: center; gap: .6rem; padding: .55rem .6rem; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
    .alt-adim-satiri:hover { background: #f8faf8; }
    .alt-adim-satiri.secili { border-color: #0F6E56; background: rgba(15,110,86,.06); }
    .alt-adim-durum { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #cdd9d2; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .alt-adim-durum.tamam { background: #0F6E56; border-color: #0F6E56; color: #fff; }
    .alt-adim-metin { flex-grow: 1; font-size: 13px; line-height: 1.3; }
    .alt-adim-ek-kodu { font-size: 10px; color: #8a978f; }
    .alt-adim-cikti-rozeti { font-size: 10px; font-weight: 600; color: #0F6E56; background: rgba(15,110,86,.10); border-radius: 5px; padding: .1rem .4rem; white-space: nowrap; }

    /* ---- Sol sütun: veri giriş paneli ---- */
    .veri-paneli-bos { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; color: #8a978f; text-align: center; }
    .veri-paneli-baslik { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #e2e8e4; }

    .ek4ab-secili { border: 1px solid #0F6E56; background: rgba(15,110,86,.06); border-radius: 8px; padding: .65rem .85rem; font-size: 13px; }
    .ek4ab-aday { border: 1px solid #e2e8e4; border-radius: 8px; padding: .5rem .7rem; margin-bottom: .35rem; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  </style>
</head>
<body>

  <div class="mis-kabuk" id="mis-kabuk">
    <div class="mis-marka" id="mis-marka"></div>
    <div class="mis-ustcubuk" id="mis-ustcubuk"></div>
    <nav class="mis-anamenu" id="mis-anamenu"></nav>

    <div class="mis-icerik">

      <!-- SOL: veri giriş paneli -->
      <div class="mis-icerik-birincil">
        <div class="mis-panel">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              <h2 class="mb-0" id="bBaslik">Yükleniyor...</h2>
              <div class="small text-muted">3T Süreci</div>
            </div>
            <div class="d-flex gap-2">
              <a href="/uc-t/" class="btn btn-sm btn-outline-secondary">Listeye Dön</a>
              <button class="btn btn-sm btn-outline-danger" onclick="silKayit()">Sil</button>
            </div>
          </div>

          <div id="veriPaneli">
            <div class="veri-paneli-bos">
              <i class="bi bi-arrow-right-circle" style="font-size:2rem;"></i>
              <p class="mt-2 mb-0">Sağdaki süreçten bir adım seç.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- SAĞ: süreç ağacı -->
      <div class="mis-icerik-ikincil">
        <div class="mis-panel">
          <h2>Süreç</h2>
          <div id="surecAgaci"></div>
        </div>
      </div>

    </div>

    <footer class="mis-footer" id="mis-footer"></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js"></script>
  <script src="/assets/js/mis-menu.js?v=16"></script>
  <script src="/assets/js/shell.js?v=12"></script>
  <script>
    misKabuguBaslat('uc-t', '3T<span class="ayrac">/</span>Detay');

    const API = '/api/uc-t';
    const id = new URLSearchParams(location.search).get('id');
    let kayit = null;
    let seciliAna = null;
    let seciliAlt = null;

    function tarihFormatla(iso) {
      if (!iso) return '-';
      return new Date(iso).toLocaleDateString('tr-TR');
    }
    function guvenliMetin(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    /** Yuklu bir PDF'i INDIRMEDEN, ACILIR-KAPANIR (collapse) sekilde sayfa icinde gosterir. */
    function pdfGomuluGoruntuleyiciHtml(alt, pdfUrl) {
      if (!alt || !alt.pdfDosyaYolu) return '';
      const benzersizId = 'pdf-' + Math.random().toString(36).slice(2);
      return `
        <div class="mt-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#${benzersizId}">
            <i class="bi bi-file-earmark-pdf text-danger me-1"></i>${guvenliMetin(alt.pdfOrijinalAd || 'Yüklenen belge')} - göster/gizle
          </button>
          <a href="${pdfUrl}" target="_blank" class="btn btn-sm btn-link">Yeni sekmede aç</a>
          <div class="collapse mt-2" id="${benzersizId}">
            <iframe src="${pdfUrl}" style="width:100%; height:70vh; border:1px solid #e2e8e4; border-radius:8px;"></iframe>
          </div>
        </div>`;
    }

    /** Uretilen resmi metni bir textarea icinde, "Kopyala" butonuyla gosterir. */
    let _belgeAyarlari = null;
    async function belgeAyarlariniGetir() {
      if (_belgeAyarlari) return _belgeAyarlari;
      const json = await fetch('/api/belge-ayarlari').then((r) => r.json());
      _belgeAyarlari = json.success ? json.data : { imzaRengi: '#999999', wordYaziTipi: 'Times New Roman' };
      return _belgeAyarlari;
    }

    function kopyalanabilirMetinHtml(benzersizId, metin) {
      return `
        <div class="mt-2">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label small fw-semibold mb-0">Kopyalanabilir Metin</label>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="metniKopyala('${benzersizId}')"><i class="bi bi-clipboard me-1"></i>Kopyala</button>
          </div>
          <textarea class="form-control form-control-sm" id="${benzersizId}" rows="7" readonly style="font-size:12px; line-height:1.5;">${metin}</textarea>
        </div>`;
    }
    window.metniKopyala = (elId) => {
      const el = document.getElementById(elId);
      el.select();
      navigator.clipboard.writeText(el.value);
    };

    // ================= SAĞ: SÜREÇ AĞACI =================
    function renderSurec() {
      const alan = document.getElementById('surecAgaci');
      alan.innerHTML = kayit.surec.map((ana, ai) => {
        const tamam = ana.altAdimlar.filter((a) => a.tamamlandiMi).length;
        return `
          <div class="ana-adim-blok">
            <div class="ana-adim-baslik">
              <span>${guvenliMetin(ana.ad)}</span>
              <span class="ana-adim-ilerleme">${tamam}/${ana.altAdimlar.length}</span>
            </div>
            ${ana.altAdimlar.map((alt, alti) => `
              <div class="alt-adim-satiri ${seciliAna === ai && seciliAlt === alti ? 'secili' : ''}" onclick="adimSec(${ai}, ${alti})">
                <div class="alt-adim-durum ${alt.tamamlandiMi ? 'tamam' : ''}">${alt.tamamlandiMi ? '<i class="bi bi-check"></i>' : ''}</div>
                <div class="alt-adim-metin">
                  ${guvenliMetin(alt.ad)}
                  <div class="alt-adim-ek-kodu">${guvenliMetin(alt.ekKodu || '')}</div>
                </div>
                ${alt.tamamlandiMi && alt.ciktiVarMi ? `<span class="alt-adim-cikti-rozeti">${guvenliMetin(alt.ekKodu)}</span>` : ''}
              </div>
            `).join('')}
          </div>`;
      }).join('');
    }

    // ================= SOL: VERİ GİRİŞ PANELİ =================
    window.adimSec = (anaAdimIndex, altAdimIndex) => {
      seciliAna = anaAdimIndex;
      seciliAlt = altAdimIndex;
      renderSurec();
      renderVeriPaneli();
    };

    function renderVeriPaneli() {
      const panel = document.getElementById('veriPaneli');
      if (seciliAna === null) {
        panel.innerHTML = `<div class="veri-paneli-bos"><i class="bi bi-arrow-right-circle" style="font-size:2rem;"></i><p class="mt-2 mb-0">Sağdaki süreçten bir adım seç.</p></div>`;
        return;
      }
      const ana = kayit.surec[seciliAna];
      const alt = ana.altAdimlar[seciliAlt];

      panel.innerHTML = `
        <div class="veri-paneli-baslik">
          <div>
            <div class="small text-muted">${guvenliMetin(ana.ad)}</div>
            <h4 class="mb-0">${guvenliMetin(alt.ad)}</h4>
            ${alt.ekKodu ? `<span class="badge bg-secondary mt-1">${guvenliMetin(alt.ekKodu)}</span>` : ''}
          </div>
          <span class="badge ${alt.tamamlandiMi ? 'bg-success' : 'bg-warning text-dark'}">${alt.tamamlandiMi ? 'Tamamlandı' : 'Bekliyor'}</span>
        </div>
        <div id="veriPaneliGovde"></div>
      `;

      if (alt.tip === 'komisyonTeknikEkipSecimi') return renderKomisyonTeknikEkipPaneli(alt);
      if (alt.tip === 'ilMeraKomisyonuKarari') return renderKarar1Paneli(alt);
      if (alt.tip === 'duyuru') return renderDuyuruPaneli(alt);
      if (alt.tip === 'duyuruTutanagi') return renderDuyuruTutanagiPaneli(alt);
      if (alt.tip === 'tebligBelgesi') return renderTebligBelgesiPaneli(alt);
      if (alt.tip === 'ek3aBilgiCetveli') return renderEk3aPaneli(alt);
      if (alt.tip === 'ek4a') return renderEk4aPaneli(alt);
      if (alt.tip === 'ek4b') return renderEk4bPaneli(alt);
      if (alt.tip === 'birlestir') return renderBirlestirPaneli();
      return renderManuelPaneli(alt);
    }

    // ---- ADIM 0: KOMİSYON VE TEKNİK EKİP SEÇİMİ paneli ----
    async function renderKomisyonTeknikEkipPaneli(alt) {
      const govde = document.getElementById('veriPaneliGovde');
      const v = alt.veri || {};

      govde.innerHTML = `
        <p class="text-muted small">
          Bu 3T kaydı için GENEL referans olacak İl Mera Komisyonu ve
          Teknik Ekip'i seç. Sonraki adımlar (İl Mera Komisyonu Kararı,
          Muhtar otomatik doldurma vb.) bunları ÖN-SEÇİLİ olarak
          kullanır, ama HER ADIM kendi içinde BAĞIMSIZ olarak farklı
          bir komisyon/dönem seçebilir (bir kişi bu kararda imzacı
          olmasa da başka belgelerde imzacı olabildiği için).
        </p>
        <div class="mb-2">
          <label class="form-label small fw-semibold">Yıl</label>
          <input type="number" class="form-control form-control-sm" id="kteYil" style="max-width:140px;" value="${v.yil || new Date().getFullYear()}">
        </div>
        <div class="mb-2">
          <label class="form-label small fw-semibold">İl Mera Komisyonu</label>
          <select id="kteKomisyonSelect" class="form-select form-select-sm"><option value="">Yükleniyor...</option></select>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Teknik Ekip</label>
          <select id="kteTeknikEkipSelect" class="form-select form-select-sm"><option value="">Yükleniyor...</option></select>
        </div>
        <button class="btn btn-primary btn-sm" onclick="komisyonTeknikEkipKaydet()">Kaydet</button>
        <button class="btn btn-link btn-sm text-muted" onclick="genelIslemsizTamamla()">Formu doldurmadan tamamlandı işaretle</button>
        <div id="kteSonuc" class="mt-2"></div>
      `;

      await komisyonTeknikEkipSecenekleriniDoldur(v.komisyonId, v.teknikEkipId);

      document.getElementById('kteYil').addEventListener('change', () => komisyonTeknikEkipYilaGoreOner());
    }

    let kteKomisyonTS = null;
    let kteTeknikEkipTS = null;

    async function komisyonTeknikEkipSecenekleriniDoldur(oncekiKomisyonId, oncekiTeknikEkipId) {
      const komisyonJson = await fetch(`${API}/komisyon-adaylari?il=${encodeURIComponent(kayit.il)}`).then((r) => r.json());
      const kSelect = document.getElementById('kteKomisyonSelect');
      kSelect.innerHTML = (komisyonJson.success && komisyonJson.data.length)
        ? '<option value="">— Seç —</option>' + komisyonJson.data.map((k) => `<option value="${k._id}" data-yil="${k.yil}" ${oncekiKomisyonId === k._id ? 'selected' : ''}>${k.yil} - ${k.il}</option>`).join('')
        : '<option value="">Bu il için kayıtlı komisyon yok</option>';

      const ekipJson = await fetch('/api/teknik-ekip').then((r) => r.json());
      const tSelect = document.getElementById('kteTeknikEkipSelect');
      const tumEkipler = (ekipJson.success ? ekipJson.data : [])
        .flatMap((yilGrup) => yilGrup.ekipler.map((e) => ({ ...e, yil: yilGrup.yil })))
        .filter((e) => (e.ilce || '').trim().toLocaleLowerCase('tr-TR') === (kayit.ilce || '').trim().toLocaleLowerCase('tr-TR'));
      tSelect.innerHTML = tumEkipler.length
        ? '<option value="">— Seç —</option>' + tumEkipler.map((e) => `<option value="${e._id}" data-yil="${e.yil}" ${oncekiTeknikEkipId === e._id ? 'selected' : ''}>${e.yil} - ${e.ekipNo ? e.ekipNo + ' Nolu ' : ''}${e.ilce} Teknik Ekibi</option>`).join('')
        : '<option value="">Bu ilçe için kayıtlı ekip yok</option>';

      // KULLANICININ ACIK ISTEGI: Komisyon ve Teknik Ekip secimi de
      // ARANABILIR olsun (Ek-4ab'deki BBHB/CKS aramasiyla AYNI desen -
      // Tom Select, secenek METNI ICINDE arama yapar).
      if (kteKomisyonTS) { kteKomisyonTS.destroy(); }
      if (kteTeknikEkipTS) { kteTeknikEkipTS.destroy(); }
      kteKomisyonTS = new TomSelect(kSelect, { create: false, placeholder: 'Yıl/İl ara veya seç...', maxOptions: null });
      kteTeknikEkipTS = new TomSelect(tSelect, { create: false, placeholder: 'Yıl/İlçe ara veya seç...', maxOptions: null });
    }

    /** Yil degistiginde, O YILA AIT komisyon/ekip varsa OTOMATIK oner (secili yap) - degistirilebilir kalir. */
    function komisyonTeknikEkipYilaGoreOner() {
      const yil = document.getElementById('kteYil').value;
      const kSelect = document.getElementById('kteKomisyonSelect');
      const tSelect = document.getElementById('kteTeknikEkipSelect');
      const kEslesen = Array.from(kSelect.options).find((o) => o.dataset.yil === yil);
      if (kEslesen && kteKomisyonTS) kteKomisyonTS.setValue(kEslesen.value);
      const tEslesen = Array.from(tSelect.options).find((o) => o.dataset.yil === yil);
      if (tEslesen && kteTeknikEkipTS) kteTeknikEkipTS.setValue(tEslesen.value);
    }

    window.komisyonTeknikEkipKaydet = async () => {
      const sonucAlan = document.getElementById('kteSonuc');
      const veri = {
        yil: Number(document.getElementById('kteYil').value) || undefined,
        komisyonId: document.getElementById('kteKomisyonSelect').value || null,
        teknikEkipId: document.getElementById('kteTeknikEkipSelect').value || null,
      };
      sonucAlan.innerHTML = '<span class="text-muted small">Kaydediliyor...</span>';
      const res = await fetch(`${API}/${id}/adim-veri`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ anaAdimIndex: seciliAna, altAdimIndex: seciliAlt, veri }),
      });
      const json = await res.json();
      if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger small">${json.message}</span>`; return; }
      kayit = json.data;
      renderSurec();
      sonucAlan.innerHTML = '<span class="text-success small"><i class="bi bi-check-circle me-1"></i>Kaydedildi.</span>';
    };

    // ---- ADIM 1: İL MERA KOMİSYONU KARARI paneli ----
    let _karar1SeciliKomisyon = null;
    let _karar1KurumListesi = null;
    let _karar1Secimler = {}; // { kurumKod: 'asil'|'yedek' }
    let _karar1IlkYukleme = false;
    // KANUN SIRASI (4342 sayili Mera Kanunu m.6): "...Bakanlik il muduru,
    // Bakanlik il mudurlugunden konu uzmani bir ziraat muhendisi
    // (Teknik Personel), Devlet Su Isleri Genel Mudurlugu yetkili
    // temsilcisi, Orman Genel Mudurlugu yetkili temsilcisi, ilgili
    // koy veya mahalle muhtari (Muhtar - AYRI bir bolumde zaten var,
    // bu listede DEGIL), defterdarliktan... bir hukukcu, Milli Emlak
    // Mudurlugunden bir temsilci, Kadastro Mudurlugunden bir teknik
    // eleman, Ziraat Odasi Baskanligindan bir temsilci ve ilgisine
    // gore genel kolluk biriminde gorevli bir temsilci (Jandarma/
    // Emniyet) olmak uzere ON BIR KISIDEN olusan bir komisyon..."
    // "Vali" KANUNUN 11 KISILIK LISTESINDE HIC YOK (sadece opsiyonel,
    // sistemin eklediği ekstra bir katilimci/imzaci) - bu yuzden EN
    // SONA alindi. ilMudur/teknikPersonel, gosterilecekKodlar'da
    // BASKANLIK ZINCIRINE GORE (baskan degillerse) AYRICA eklenir,
    // bu listede TEKRAR YOK.
    const K1_DIGER_KURUM_KODLARI = ['dsi', 'ogm', 'defterdarlik', 'milliEmlakMudurlugu', 'milliEmlakDairesi', 'kadastro', 'ziraatOdasi', 'jandarma', 'polis', 'vali'];

    async function renderKarar1Paneli(alt) {
      const govde = document.getElementById('veriPaneliGovde');
      const oncekiVeri = alt.veri || {};
      const b = oncekiVeri.baskanlik || {};
      _karar1Secimler = {};
      (oncekiVeri.katilimcilar || []).forEach((k) => { _karar1Secimler[k.kurumKod] = k.temsilciTipi; });
      // KULLANICININ ACIK ISTEGI: "katilimcilarin hepsi asil olarak
      // secili olsun" - bu SADECE ILK KEZ (henuz hic kaydedilmemis,
      // yani onceden KAYITLI katilimci YOKSA) gecerlidir - kullanicinin
      // SONRADAN bilerek "dahil degil" yaptigi bir kurum, PANEL
      // yeniden render edildiginde (baskanlik degisikligi vb.) GERI
      // GELMESIN diye bu bayrak SADECE ILK ACILISTA true olur.
      _karar1IlkYukleme = (oncekiVeri.katilimcilar || []).length === 0;

      if (!_karar1KurumListesi) {
        const kj = await fetch('/api/il-mera-komisyonu/kurum-listesi').then((r) => r.json());
        _karar1KurumListesi = kj.success ? kj.data : [];
      }

      govde.innerHTML = `
        <div class="row g-2 mb-2">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Karar Tarihi *</label>
            <input type="date" class="form-control form-control-sm" id="k1Tarih" value="${oncekiVeri.kararTarihi ? oncekiVeri.kararTarihi.slice(0, 10) : ''}">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Karar Sayısı *</label>
            <input type="text" class="form-control form-control-sm" id="k1Sayi" value="${guvenliMetin(oncekiVeri.kararSayisi || '')}">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">İl Mera Komisyonu *</label>
          <select id="k1KomisyonSelect" class="form-select form-select-sm"><option value="">Yükleniyor...</option></select>
          <div class="form-text small">Listede yoksa Ayarlar → Personel Yönetimi → İl Mera Komisyonu Üyeleri'nden ekle.</div>
        </div>

        <div class="mb-3 p-2 border rounded">
          <label class="form-label small fw-semibold d-block">Başkanlık</label>
          <p class="text-muted small mb-2">4342 Sayılı Kanun m.3 gereği: normalde Vali Yardımcısı başkanlık eder; o yoksa İl Müdürü, o da yoksa Teknik Personel (ziraat mühendisi) başkanlık eder.</p>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="k1VYYok" ${b.valiYardimcisiYok ? 'checked' : ''}>
            <label class="form-check-label small" for="k1VYYok">Vali Yardımcısı yok/katılmıyor</label>
          </div>
          <div id="k1IlMudurSorusu" class="ms-3" style="display:none;">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="k1IlMudurYok" ${b.ilMuduruYok ? 'checked' : ''}>
              <label class="form-check-label small" for="k1IlMudurYok">İl Müdürü de yok/katılmıyor</label>
            </div>
          </div>
          <div id="k1BaskanSonucAlani" class="mt-2"></div>
        </div>

        <div id="k1KatilimcilarAlani" class="mb-3"></div>

        <div class="mb-3 p-2 border rounded">
          <label class="form-label small fw-semibold d-block">Muhtar (${guvenliMetin(kayit.koyMahalle)} Köyü/Mahallesi)</label>
          <div class="row g-2">
            <div class="col-6"><input type="text" class="form-control form-control-sm" id="k1MuhtarAd" placeholder="Ad Soyad" value="${guvenliMetin(oncekiVeri.muhtar?.adSoyad || '')}"></div>
            <div class="col-6"><input type="text" class="form-control form-control-sm" id="k1MuhtarYedekAd" placeholder="Yedek (varsa)" value="${guvenliMetin(oncekiVeri.muhtar?.yedekAdSoyad || '')}"></div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">Karar Belgesi (PDF)</label>
          <input type="file" class="form-control form-control-sm" id="k1PdfInput" accept="application/pdf">
        </div>
        ${pdfGomuluGoruntuleyiciHtml(alt, `${API}/${id}/adim-pdf/${seciliAna}/${seciliAlt}`)}

        <button class="btn btn-primary btn-sm mt-2" onclick="karar1Kaydet()">Kaydet</button>
        <button class="btn btn-link btn-sm text-muted" onclick="karar1IslemsizTamamla()">Formu doldurmadan tamamlandı işaretle</button>
        <div id="k1Sonuc" class="mt-2"></div>
      `;

      // "Komisyon ve Teknik Ekip Secimi" on-adimindan (varsa) VARSAYILAN komisyonu al -
      // ama BAGIMSIZ secim serbestligi korunur (kullanici burada FARKLI bir komisyon secebilir).
      const kteAdim = kayit.surec.flatMap((a) => a.altAdimlar).find((a) => a.tip === 'komisyonTeknikEkipSecimi');
      const varsayilanKomisyonId = oncekiVeri.komisyonId || kteAdim?.veri?.komisyonId || '';

      const komisyonJson = await fetch(`${API}/komisyon-adaylari?il=${encodeURIComponent(kayit.il)}`).then((r) => r.json());
      const select = document.getElementById('k1KomisyonSelect');
      if (komisyonJson.success && komisyonJson.data.length) {
        select.innerHTML = '<option value="">— Seç —</option>' + komisyonJson.data.map((k) => `<option value="${k._id}" data-yil="${k.yil}" ${varsayilanKomisyonId === k._id ? 'selected' : ''}>${k.yil} - ${k.il}</option>`).join('');
      } else {
        select.innerHTML = '<option value="">Bu il için kayıtlı komisyon yok</option>';
      }
      // KULLANICININ ACIK ISTEGI: burada da ARANABILIR olsun.
      const k1KomisyonTS = new TomSelect(select, { create: false, placeholder: 'Yıl/İl ara veya seç...', maxOptions: null });
      k1KomisyonTS.on('change', karar1KomisyonSecildi);
      document.getElementById('k1VYYok').addEventListener('change', karar1BaskanlikGuncelle);
      document.getElementById('k1IlMudurYok').addEventListener('change', karar1BaskanlikGuncelle);

      // Karar Tarihi girildiginde/degistiginde, O YILA AIT komisyon
      // varsa OTOMATIK oner (secili yap) - komisyon secimi ve karar
      // tarihi BAGIMSIZDIR, bu sadece bir KOLAYLIK onerisi, kullanici
      // yine de BASKA bir yilin komisyonunu secebilir.
      document.getElementById('k1Tarih').addEventListener('change', () => {
        const secilenYil = document.getElementById('k1Tarih').value ? new Date(document.getElementById('k1Tarih').value).getFullYear().toString() : '';
        const eslesen = Array.from(select.options).find((o) => o.dataset.yil === secilenYil);
        if (eslesen) { k1KomisyonTS.setValue(eslesen.value); }
      });

      if (select.value) await karar1KomisyonSecildi();
      karar1BaskanlikSorularinaGoster();
      karar1BaskanlikGuncelle();
    }

    function karar1BaskanlikSorularinaGoster() {
      document.getElementById('k1IlMudurSorusu').style.display = document.getElementById('k1VYYok').checked ? 'block' : 'none';
    }

    async function karar1KomisyonSecildi() {
      const komisyonId = document.getElementById('k1KomisyonSelect').value;
      if (!komisyonId) { _karar1SeciliKomisyon = null; document.getElementById('k1KatilimcilarAlani').innerHTML = ''; karar1BaskanlikGuncelle(); return; }
      const json = await fetch(`/api/il-mera-komisyonu/${komisyonId}`).then((r) => r.json());
      if (!json.success) return;
      _karar1SeciliKomisyon = json.data;
      karar1KatilimcilariGuncelle();
      karar1BaskanlikGuncelle();

      // Komisyonun YILINA gore Teknik Ekip'te bu koyun muhtari kayitli mi -
      // varsa Muhtar alanini OTOMATIK doldur (BOSSA - kullanicinin
      // girdigini EZME), her zaman DUZENLENEBILIR kalir.
      const muhtarAdInput = document.getElementById('k1MuhtarAd');
      if (muhtarAdInput && !muhtarAdInput.value.trim()) {
        const mJson = await fetch(`/api/teknik-ekip/muhtar-bul?yil=${_karar1SeciliKomisyon.yil}&il=${encodeURIComponent(kayit.il)}&ilce=${encodeURIComponent(kayit.ilce)}&koyMahalle=${encodeURIComponent(kayit.koyMahalle)}`).then((r) => r.json());
        if (mJson.success && mJson.data) muhtarAdInput.value = mJson.data.adSoyad;
      }
    }

    /**
     * Baskanligin KIM oldugunu dondurur - 4342 sayili Kanun m.3 geregi
     * Vali'nin KENDISI bu zincirin PARCASI DEGILDIR (sadece opsiyonel
     * katilimci): normalde Vali Yardimcisi, o yoksa Il Muduru, o da
     * yoksa Teknik Personel (ziraat muhendisi) - ZORUNLU son halka,
     * ayrica soru sorulmaz.
     */
    function karar1BaskanTipi() {
      const vyYok = document.getElementById('k1VYYok').checked;
      if (!vyYok) return 'valiYardimcisi';
      const ilMudurYok = document.getElementById('k1IlMudurYok')?.checked;
      if (!ilMudurYok) return 'ilMudur';
      return 'teknikPersonel';
    }

    function karar1BaskanlikGuncelle() {
      karar1BaskanlikSorularinaGoster();
      const sonucAlan = document.getElementById('k1BaskanSonucAlani');
      const tip = karar1BaskanTipi();

      if (tip === 'valiYardimcisi') {
        const vy = _karar1SeciliKomisyon ? _karar1SeciliKomisyon.uyeler.find((u) => u.kurumKod === 'valiYardimcisi') : null;
        sonucAlan.innerHTML = `<div class="small"><strong>${guvenliMetin(vy?.asilAdSoyad || '(komisyon kaydında Vali Yardımcısı bilgisi yok)')}</strong> - Vali Yardımcısı</div>`;
        karar1KatilimcilariGuncelle();
        return;
      }
      if (tip === 'ilMudur') {
        const im = _karar1SeciliKomisyon ? _karar1SeciliKomisyon.uyeler.find((u) => u.kurumKod === 'ilMudur') : null;
        sonucAlan.innerHTML = `<div class="small"><strong>${guvenliMetin(im?.asilAdSoyad || '(komisyon kaydında İl Müdürü bilgisi yok)')}</strong> - İl Müdürü</div>`;
        karar1KatilimcilariGuncelle();
        return;
      }
      // tip === 'teknikPersonel' (zincirin zorunlu son halkasi)
      const tp = _karar1SeciliKomisyon ? _karar1SeciliKomisyon.uyeler.find((u) => u.kurumKod === 'teknikPersonel') : null;
      sonucAlan.innerHTML = `<div class="small"><strong>${guvenliMetin(tp?.asilAdSoyad || '(komisyon kaydında Teknik Personel bilgisi yok)')}</strong> - Teknik Personel</div>`;
      karar1KatilimcilariGuncelle();
    }

    function karar1KatilimcilariGuncelle() {
      const alan = document.getElementById('k1KatilimcilarAlani');
      if (!_karar1SeciliKomisyon) { alan.innerHTML = '<div class="text-muted small">Katılımcılar için önce komisyon seç.</div>'; return; }

      const baskanTip = karar1BaskanTipi();
      // Il Muduru ve Teknik Personel, BASKAN OLMADIKLARI durumda normal katilimci listesinde gorunur.
      // Milli Emlak Mudurlugu/Dairesi Baskanligi'ndan SADECE komisyonun
      // milliEmlakTuru'na uyan biri gosterilir.
      const gecerliMilliEmlakKodu = _karar1SeciliKomisyon.milliEmlakTuru === 'dairesiBaskanligi' ? 'milliEmlakDairesi' : 'milliEmlakMudurlugu';
      // KANUN SIRASI: ...DSİ, Orman, (Muhtar - ayrı), Defterdarlık,
      // Milli Emlak, Kadastro, Ziraat Odası, Genel Kolluk (Jandarma/
      // Emniyet)... - Milli Emlak'ı DIZI SONUNA ATMAK yerine
      // Defterdarlık'tan HEMEN SONRAKI dogru konumuna YERLESTIRIYORUZ.
      // "Vali" kanunun 11 kisilik listesinde OLMADIGI icin EN SONA
      // birakildi (K1_DIGER_KURUM_KODLARI'nin kendisinde zaten sonda).
      const digerKodlarMilliEmlakYerlesmis = [];
      K1_DIGER_KURUM_KODLARI.forEach((kod) => {
        if (kod === 'milliEmlakMudurlugu' || kod === 'milliEmlakDairesi') return; // asil/dairesi ayrimini asagida TEK kod olarak ekleyecegiz
        digerKodlarMilliEmlakYerlesmis.push(kod);
        if (kod === 'defterdarlik') digerKodlarMilliEmlakYerlesmis.push(gecerliMilliEmlakKodu);
      });
      const gosterilecekKodlar = [
        ...(baskanTip !== 'ilMudur' ? ['ilMudur'] : []),
        ...(baskanTip !== 'teknikPersonel' ? ['teknikPersonel'] : []),
        ...digerKodlarMilliEmlakYerlesmis,
      ];

      // KULLANICININ ACIK ISTEGI: "katilimcilarin hepsi asil olarak
      // secili olsun" - SADECE ILK ACILISTA (henuz hic kaydedilmemis
      // bir karar icin), TUM gosterilen kurumlar VARSAYILAN olarak
      // "dahil + asil" isaretlenir - kullanici istemediklerini
      // CIKARABILIR/yedek YAPABILIR. Bayrak, TEKRAR render'larda
      // (baskanlik degisikligi vb.) kullanicinin SONRADAN yaptigi
      // "dahil degil" secimlerini GERI GETIRMEMEK icin SADECE BIR KEZ
      // uygulanir.
      if (_karar1IlkYukleme) {
        gosterilecekKodlar.forEach((kod) => { if (_karar1Secimler[kod] === undefined) _karar1Secimler[kod] = 'asil'; });
        _karar1IlkYukleme = false;
      }

      alan.innerHTML = `
        <label class="form-label small fw-semibold d-block">Katılımcılar</label>
        <table class="table table-sm align-middle">
          <thead><tr><th></th><th>Kurum</th><th>Asıl</th><th>Yedek</th></tr></thead>
          <tbody>
            ${gosterilecekKodlar.map((kod) => {
              const tanim = _karar1KurumListesi.find((k) => k.kod === kod) || { ad: kod, yedekVar: true };
              const uye = _karar1SeciliKomisyon.uyeler.find((u) => u.kurumKod === kod) || {};
              const dahil = _karar1Secimler[kod] !== undefined;
              const secilenTip = _karar1Secimler[kod] || 'asil';
              return `
                <tr>
                  <td><input type="checkbox" class="form-check-input k1-dahil-check" data-kod="${kod}" ${dahil ? 'checked' : ''} onchange="karar1DahilDegisti('${kod}', this.checked)"></td>
                  <td class="small">${guvenliMetin(tanim.ad)}</td>
                  <td><label class="small"><input type="radio" name="k1tip_${kod}" value="asil" ${secilenTip === 'asil' ? 'checked' : ''} onchange="_karar1Secimler['${kod}']='asil'"> ${guvenliMetin(uye.asilAdSoyad || '-')}</label></td>
                  <td>${tanim.yedekVar === false ? '<span class="text-muted small">Yedeği yok</span>' : `<label class="small"><input type="radio" name="k1tip_${kod}" value="yedek" ${secilenTip === 'yedek' ? 'checked' : ''} onchange="_karar1Secimler['${kod}']='yedek'"> ${guvenliMetin(uye.yedekAdSoyad || '-')}</label>`}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    window.karar1DahilDegisti = (kod, dahilMi) => {
      if (dahilMi) { if (!_karar1Secimler[kod]) _karar1Secimler[kod] = 'asil'; }
      else { delete _karar1Secimler[kod]; }
    };

    function karar1KatilimciListesiniTopla() {
      const sonuc = [];
      if (_karar1SeciliKomisyon) {
        document.querySelectorAll('.k1-dahil-check:checked').forEach((chk) => {
          const kod = chk.dataset.kod;
          const uye = _karar1SeciliKomisyon.uyeler.find((u) => u.kurumKod === kod) || {};
          const tip = _karar1Secimler[kod] || 'asil';
          const tanim = _karar1KurumListesi.find((k) => k.kod === kod) || { ad: kod };
          sonuc.push({
            kurumKod: kod, kurumAdi: tanim.ad, temsilciTipi: tip,
            adSoyad: tip === 'asil' ? uye.asilAdSoyad : uye.yedekAdSoyad,
            unvan: tip === 'asil' ? uye.asilUnvan : uye.yedekUnvan,
          });
        });
      }
      const muhtarAd = (document.getElementById('k1MuhtarAd')?.value || '').trim();
      if (muhtarAd) {
        sonuc.push({
          kurumKod: 'muhtar', kurumAdi: 'Muhtar', temsilciTipi: 'asil',
          adSoyad: muhtarAd, unvan: `${kayit.koyMahalle} Muhtarı`,
          yedekAdSoyad: (document.getElementById('k1MuhtarYedekAd')?.value || '').trim() || undefined,
        });
      }
      return sonuc;
    }

    function karar1BaskanlikBilgisiniTopla() {
      const tip = karar1BaskanTipi();
      const b = {
        valiYardimcisiYok: document.getElementById('k1VYYok').checked,
        ilMuduruYok: document.getElementById('k1IlMudurYok')?.checked || false,
        tip,
      };
      if (tip === 'valiYardimcisi') {
        const vy = _karar1SeciliKomisyon ? _karar1SeciliKomisyon.uyeler.find((u) => u.kurumKod === 'valiYardimcisi') : null;
        b.adSoyad = vy?.asilAdSoyad || '';
        b.unvan = 'Vali Yardımcısı';
      } else if (tip === 'ilMudur') {
        const im = _karar1SeciliKomisyon ? _karar1SeciliKomisyon.uyeler.find((u) => u.kurumKod === 'ilMudur') : null;
        b.adSoyad = im?.asilAdSoyad || '';
        b.unvan = 'İl Müdürü';
      } else {
        const tp = _karar1SeciliKomisyon ? _karar1SeciliKomisyon.uyeler.find((u) => u.kurumKod === 'teknikPersonel') : null;
        b.adSoyad = tp?.asilAdSoyad || '';
        b.unvan = 'Teknik Personel';
      }
      return b;
    }

    window.karar1Kaydet = async () => {
      const sonucAlan = document.getElementById('k1Sonuc');
      const kararTarihi = document.getElementById('k1Tarih').value;
      const kararSayisi = document.getElementById('k1Sayi').value.trim();
      const komisyonId = document.getElementById('k1KomisyonSelect').value;
      const pdfDosya = document.getElementById('k1PdfInput').files[0];

      if (!kararTarihi || !kararSayisi) { sonucAlan.innerHTML = '<span class="text-danger small">Karar tarihi ve sayısı zorunludur.</span>'; return; }
      if (!komisyonId) { sonucAlan.innerHTML = '<span class="text-danger small">İl Mera Komisyonu seçilmelidir.</span>'; return; }

      const formData = new FormData();
      formData.append('anaAdimIndex', seciliAna);
      formData.append('altAdimIndex', seciliAlt);
      formData.append('kararTarihi', kararTarihi);
      formData.append('kararSayisi', kararSayisi);
      formData.append('komisyonId', komisyonId);
      formData.append('baskanlik', JSON.stringify(karar1BaskanlikBilgisiniTopla()));
      formData.append('katilimcilar', JSON.stringify(karar1KatilimciListesiniTopla()));
      if (pdfDosya) formData.append('pdf', pdfDosya);

      sonucAlan.innerHTML = '<span class="text-muted small">Kaydediliyor...</span>';
      const res = await fetch(`${API}/${id}/karar1-kaydet`, { method: 'PUT', body: formData });
      const json = await res.json();
      if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger small">${json.message}</span>`; return; }

      kayit = json.data;
      renderSurec();
      renderVeriPaneli();
      sonucAlan.innerHTML = '<span class="text-success small"><i class="bi bi-check-circle me-1"></i>Kaydedildi.</span>';
    };

    // "Formu doldurmadan tamamla" - ILERIDE kullanici yetkilerinde
    // "3T adimini islemsiz tamamlama izni" ile GATE EDILECEK. Simdilik
    // herkese acik (izin sistemi henuz yok).
    window.karar1IslemsizTamamla = async () => {
      if (!confirm('Bu adımı, formu doldurmadan tamamlandı olarak işaretlemek istediğine emin misin?')) return;
      await adimKaydetIslemsiz();
    };

    async function adimKaydetIslemsiz() {
      const res = await fetch(`${API}/${id}/adim`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ anaAdimIndex: seciliAna, altAdimIndex: seciliAlt, tamamlandiMi: true }),
      });
      const json = await res.json();
      if (json.success) { kayit = json.data; renderSurec(); renderVeriPaneli(); }
    }

    // ---- ADIM 2: DUYURU (Ek-1) paneli ----
    /** TEK imzali belgeler (Duyuru/Tebliğ) icin sag sutunda ortali imza blogu HTML'i. */
    async function tekImzaHtmlOlustur(tarihSatiri, adSoyad, unvan, altYazi) {
      const ayarlar = await belgeAyarlariniGetir();
      return `
        <div style="display:flex; margin-top:1rem;">
          <div style="flex:1;"></div>
          <div style="flex:1;"></div>
          <div style="flex:1; text-align:center;">
            <div>${guvenliMetin(tarihSatiri)}</div>
            <div style="height:1.3em;"></div>
            <div style="color:${ayarlar.imzaRengi}; font-size:12px;">İMZA</div>
            <div style="height:1.3em;"></div>
            <div style="font-weight:600;">${guvenliMetin(adSoyad)}</div>
            <div>${guvenliMetin(unvan)}</div>
            <div>${guvenliMetin(altYazi)}</div>
          </div>
        </div>`;
    }

    /** DORTLU (Duyuru Tutanağı) imza izgarasi HTML'i - imza cizgisi + 1 satir bosluk + etiketler. */
    async function dortluImzaHtmlOlustur() {
      const ayarlar = await belgeAyarlariniGetir();
      const sutun = () => `
        <td style="width:25%; text-align:center; vertical-align:top; padding: 8px;">
          <div style="height:1em;"></div>
          <div style="color:${ayarlar.imzaRengi}; font-size:11px;">İMZA</div>
          <div style="height:1em;"></div>
          <div style="color:${ayarlar.imzaRengi}; font-size:11px;">Adı Soyadı</div>
          <div style="color:${ayarlar.imzaRengi}; font-size:11px;">Ünvanı</div>
        </td>`;
      return `<table style="width:100%; border-collapse:collapse;"><tr>${sutun()}${sutun()}${sutun()}${sutun()}</tr></table>`;
    }

    /** Teknik Ekip UYELERI kadar SUTUN - digerleriyle AYNI imza kurallari, ama GERCEK isim/unvan ile. */
    async function cokluKisiImzaHtmlOlustur(kisiler) {
      if (!kisiler || !kisiler.length) return '<p class="text-muted small">Bu 3T kaydı için "Komisyon ve Teknik Ekip Seçimi" adımında Teknik Ekip seçilmemiş.</p>';
      const ayarlar = await belgeAyarlariniGetir();
      const genislik = Math.floor(100 / kisiler.length);
      const sutun = (kisi) => `
        <td style="width:${genislik}%; text-align:center; vertical-align:top; padding: 8px;">
          <div style="height:1em;"></div>
          <div style="color:${ayarlar.imzaRengi}; font-size:11px;">İMZA</div>
          <div style="height:1em;"></div>
          <div style="font-weight:600;">${guvenliMetin(kisi.adSoyad)}</div>
          <div>${guvenliMetin(kisi.unvan || '')}</div>
        </td>`;
      return `<table style="width:100%; border-collapse:collapse;"><tr>${kisiler.map(sutun).join('')}</tr></table>`;
    }

    /** Duyuru Tutanağı/Tebliğ Belgesi gibi PDF EKLENEBILEN adimlar icin ORTAK dosya ekleme blogu. */
    function dosyaEklemeHtml(prefix, alt, ekKodu) {
      const varsayilanAd = `3T_${kayit.ilce}_${kayit.koyMahalle}_${ekKodu}`.replace(/\s+/g, '');
      return `
        <div class="mt-3 p-2 border rounded">
          <label class="form-label small fw-semibold d-block">Dosya Ekle (PDF)</label>
          ${pdfGomuluGoruntuleyiciHtml(alt, `${API}/${id}/adim-pdf/${seciliAna}/${seciliAlt}`)}
          <div class="row g-2 mt-1">
            <div class="col-md-7">
              <input type="file" class="form-control form-control-sm" id="${prefix}DosyaInput" accept="application/pdf">
            </div>
            <div class="col-md-5">
              <input type="text" class="form-control form-control-sm" id="${prefix}DosyaAdi" placeholder="Dosya adı (evrak no)" value="${guvenliMetin(alt.pdfOrijinalAd || varsayilanAd)}">
            </div>
          </div>
          <button class="btn btn-sm btn-outline-secondary mt-2" onclick="genelDosyaYukle('${prefix}')">Yükle</button>
          <span id="${prefix}DosyaSonuc" class="small ms-2"></span>
        </div>`;
    }

    window.genelDosyaYukle = async (prefix) => {
      const dosyaInput = document.getElementById(`${prefix}DosyaInput`);
      const dosyaAdi = document.getElementById(`${prefix}DosyaAdi`).value.trim();
      const sonucAlan = document.getElementById(`${prefix}DosyaSonuc`);
      const dosya = dosyaInput.files[0];
      if (!dosya) { sonucAlan.innerHTML = '<span class="text-danger">Dosya seçilmedi.</span>'; return; }

      const formData = new FormData();
      formData.append('anaAdimIndex', seciliAna);
      formData.append('altAdimIndex', seciliAlt);
      formData.append('dosyaAdi', dosyaAdi);
      formData.append('dosya', dosya);

      sonucAlan.innerHTML = 'Yükleniyor...';
      const res = await fetch(`${API}/${id}/adim-dosya-yukle`, { method: 'PUT', body: formData });
      const json = await res.json();
      if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger">${json.message}</span>`; return; }
      kayit = json.data;
      renderSurec();
      renderVeriPaneli();
    };

    /** Adim 1'de belirlenen GERCEK baskanlik bilgisini (yoksa bos sablon) dondurur. */
    function baskanlikBilgisiniGetir() {
      const karar1Adim = kayit.surec.flatMap((a) => a.altAdimlar).find((a) => a.tip === 'ilMeraKomisyonuKarari');
      const b = karar1Adim?.veri?.baskanlik;
      if (b && b.adSoyad) return { adSoyad: b.adSoyad, unvan: b.unvan };
      return { adSoyad: '……………………………', unvan: '……………………………' };
    }

    async function renderDuyuruPaneli(alt) {
      const govde = document.getElementById('veriPaneliGovde');
      const v = alt.veri || {};

      govde.innerHTML = `
        <p class="text-muted small">İl/İlçe/Köy-Mahalle bu 3T kaydından otomatik alınır.</p>

          <div id="e3aCksSonuc" class="small text-muted mt-1">${v.ciftciAileSayisi != null ? `Çiftçi Aile Sayısı: ${v.ciftciAileSayisi}` : ''}</div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold d-block">7. Arazinin <span class="text-muted fw-normal">(Mera Modülü'ndeki parseller seçilerek hesaplanır)</span></label>
          <button type="button" class="btn btn-sm btn-outline-primary mb-2" onclick="ek3aParselSecPopupAc()">
            <i class="bi bi-geo-alt me-1"></i>Parsel Seç
          </button>
          <div class="table-responsive">
            <table class="table table-sm table-bordered mb-0">
              <thead><tr><th>Cinsi</th><th>Miktarı<br>Dekar</th><th>Parça<br>Adedi</th><th>Mevki</th><th>Diğer Bilgiler<br>(Kime Ait Olduğu, Nizalılık Durumu)</th></tr></thead>
              <tbody id="e3aMadde7Tablosu">
                ${(v.madde7Satirlari || ['Mera', 'Yaylak', 'Kışlak', 'Otlak', 'Çayır'].map((c) => [c, '', '', '', ''])).map((satir) => `<tr><th class="table-light">${guvenliMetin(satir[0])}</th><td>${guvenliMetin(satir[1])}</td><td>${guvenliMetin(satir[2])}</td><td>${guvenliMetin(satir[3])}</td><td>${guvenliMetin(satir[4])}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div id="e3aMadde7Sonuc" class="small mt-1"></div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold d-block">8. Mevcut Hayvan Varlığı <span class="text-muted fw-normal">(Hayvan sayıları ayrıntılı olarak belirtilecek)</span></label>
          <select id="e3aBbhbSelect" class="form-select form-select-sm"><option value="">Yükleniyor...</option></select>
          <div id="e3aBbhbOnizleme" class="mt-2"></div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold d-block">9. Kullanılan Alanlardan Yararlanma Şekli</label>
          ${EK3A_YARARLANMA_SECENEKLERI.map((s) => `
            <div class="form-check">
              <input class="form-check-input e3a-yararlanma-check" type="checkbox" value="${s}" id="e3aY_${s.replace(/[^a-zA-Z0-9]/g, '')}" ${(v.yararlanmaSekilleri || []).includes(s) ? 'checked' : ''}>
              <label class="form-check-label small" for="e3aY_${s.replace(/[^a-zA-Z0-9]/g, '')}">${s}</label>
            </div>`).join('')}
          <input type="text" class="form-control form-control-sm mt-1" id="e3aDigerYararlanma" placeholder="Diğer (elle)" value="${guvenliMetin(v.digerYararlanmaSekli || '')}">
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold d-block">10. Harita, Kroki, Pafta ve Ellerinde Mevcut Diğer Bilgiler</label>
          <div id="e3aMadde10Alani" class="small"></div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">11. 5 inci Maddedeki Şartları Taşıyıp Taşımadığına Dair Belgeler</label>
          <input type="text" class="form-control form-control-sm" id="e3aMadde11" placeholder="Not (opsiyonel)" value="${guvenliMetin(v.madde11Notu || '')}">
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">12. Kullanılan Alanlardan Yararlanma Miktar ve Şekli</label>
          <textarea class="form-control form-control-sm" id="e3aMadde12" rows="3">${guvenliMetin(v.madde12Metni || '')}</textarea>
        </div>

        <button class="btn btn-primary btn-sm" onclick="ek3aKaydet()">Kaydet</button>
        <button class="btn btn-link btn-sm text-muted" onclick="genelIslemsizTamamla()">Formu doldurmadan tamamlandı işaretle</button>
        <div id="e3aSonuc" class="mt-2"></div>
        <div id="e3aDisaAktarAlani" class="mt-2">
          ${alt.tamamlandiMi ? `
            <a class="btn btn-sm btn-outline-secondary" href="${API}/${id}/adim-disa-aktar/${seciliAna}/${seciliAlt}/word"><i class="bi bi-file-earmark-word me-1"></i>Word</a>
            <a class="btn btn-sm btn-outline-secondary" href="${API}/${id}/adim-disa-aktar/${seciliAna}/${seciliAlt}/pdf"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</a>
          ` : ''}
        </div>
        <div id="e3aImzaAlani" class="mt-3"></div>
        <div id="e3aDosyaAlani">${dosyaEklemeHtml('e3a', alt, 'ek-3a')}</div>
      `;

      // Teknik Ekip imza blogu - "Komisyon ve Teknik Ekip Secimi"
      // on-adiminda SECILEN ekibin GERCEK uyeleriyle.
      const kteAdimEk3a = kayit.surec.flatMap((a) => a.altAdimlar).find((a) => a.tip === 'komisyonTeknikEkipSecimi');
      document.getElementById('e3aImzaAlani').innerHTML = '<div class="small fw-semibold mb-1">İmza (Teknik Ekip Üyeleri)</div>';
      if (kteAdimEk3a?.veri?.teknikEkipId) {
        const ekipJson = await fetch(`/api/teknik-ekip/${kteAdimEk3a.veri.teknikEkipId}`).then((r) => r.json());
        const kisiler = ekipJson.success ? ekipJson.data.uyeler.map((u) => ({ adSoyad: u.adSoyad, unvan: u.unvan })) : [];
        document.getElementById('e3aImzaAlani').innerHTML += await cokluKisiImzaHtmlOlustur(kisiler);
      } else {
        document.getElementById('e3aImzaAlani').innerHTML += '<p class="text-muted small">Bu 3T kaydı için "Komisyon ve Teknik Ekip Seçimi" adımında Teknik Ekip seçilmemiş.</p>';
      }

      const cksJson = await fetch(`${API}/cks-adaylari?il=${encodeURIComponent(kayit.il)}&ilce=${encodeURIComponent(kayit.ilce)}&koyMahalle=${encodeURIComponent(kayit.koyMahalle)}`).then((r) => r.json());
      const cksSelect = document.getElementById('e3aCksSelect');
      cksSelect.innerHTML = (cksJson.success && cksJson.data.length)
        ? '<option value="">— Seç —</option>' + cksJson.data.map((c) => `<option value="${c._id}" ${v.cksSonucId === c._id ? 'selected' : ''}>${c.uretimYili || '-'} üretim yılı · ${c.ciftciler.length} çiftçi</option>`).join('')
        : '<option value="">Kayıt bulunamadı</option>';
      cksSelect.addEventListener('change', () => {
        const secilen = cksJson.data.find((c) => c._id === cksSelect.value);
        _ek3aSeciliCks = secilen || null;
        document.getElementById('e3aCksSonuc').textContent = secilen ? `Çiftçi Aile Sayısı: ${secilen.ciftciler.length}` : '';
      });
      if (cksSelect.value) {
        _ek3aSeciliCks = cksJson.data.find((c) => c._id === cksSelect.value) || null;
      }

      const bbhbJson = await fetch(`${API}/bbhb-adaylari?il=${encodeURIComponent(kayit.il)}&ilce=${encodeURIComponent(kayit.ilce)}&koyMahalle=${encodeURIComponent(kayit.koyMahalle)}`).then((r) => r.json());
      const bbhbSelect = document.getElementById('e3aBbhbSelect');
      bbhbSelect.innerHTML = (bbhbJson.success && bbhbJson.data.length)
        ? '<option value="">— Seç —</option>' + bbhbJson.data.map((b) => `<option value="${b._id}" ${v.bbhbSonucId === b._id ? 'selected' : ''}>${tarihFormatla(b.hesaplamaTarihi)} · Toplam BBHB: ${b.bolumToplamBBHB.toFixed(2)}</option>`).join('')
        : '<option value="">Kayıt bulunamadı</option>';

      if (v.hayvanVarligiTablosu) ek3aBbhbOnizlemeGoster(v);
      ek3aMadde10Goster(v);
    }

    /** Madde 10 alanini DOLDURUR - Madde 7'de secilen parseller VARSA "Mera Kimlikleri (PDF)" indirme linki, YOKSA uyari. */
    function ek3aMadde10Goster(v) {
      const alan = document.getElementById('e3aMadde10Alani');
      if (v.secilenParselIdleri && v.secilenParselIdleri.length) {
        alan.innerHTML = `
          <a class="btn btn-sm btn-outline-secondary" href="${API}/${id}/madde10-kimlik-pdf?anaAdimIndex=${seciliAna}&altAdimIndex=${seciliAlt}" target="_blank">
            <i class="bi bi-file-earmark-pdf me-1"></i>Mera Kimlikleri (PDF) - ${v.secilenParselIdleri.length} parsel
          </a>`;
      } else {
        alan.innerHTML = '<span class="text-muted">Madde 7\'de "Parsel Seç" ile parsel seçip kaydettiğinizde, o parsellerin Mera Kimlikleri buradan PDF olarak indirilebilir hale gelecek.</span>';
      }
    }

    /** "X adet (Y BBHB)" formatinda hucre metni. */
    function ek3aHucreMetni(h) {
      return h.adet > 0 ? `${h.adet} adet (${h.bbhb.toFixed(2)} BBHB)` : '-';
    }

    function ek3aBbhbOnizlemeGoster(v) {
      const t = v.hayvanVarligiTablosu;
      document.getElementById('e3aBbhbOnizleme').innerHTML = `
        <table class="table table-sm table-bordered">
          <thead><tr><th></th><th>Kültür</th><th>Kültür Melezi</th><th>Yerli</th></tr></thead>
          <tbody>
            <tr><th class="table-light">Büyükbaş</th><td>${ek3aHucreMetni(t.buyukbas.kultur)}</td><td>${ek3aHucreMetni(t.buyukbas.kulturMelezi)}</td><td>${ek3aHucreMetni(t.buyukbas.yerli)}</td></tr>
            <tr><th class="table-light">Küçükbaş</th><td>${ek3aHucreMetni(t.kucukbas.kultur)}</td><td>${ek3aHucreMetni(t.kucukbas.kulturMelezi)}</td><td>${ek3aHucreMetni(t.kucukbas.yerli)}</td></tr>
            <tr><th class="table-light">Diğerleri</th><td>${ek3aHucreMetni(t.digerleri.kultur)}</td><td>${ek3aHucreMetni(t.digerleri.kulturMelezi)}</td><td>${ek3aHucreMetni(t.digerleri.yerli)}</td></tr>
          </tbody>
        </table>
        <div class="small text-muted">Toplam BBHB: ${v.bbhbToplam.toFixed(2)} · Manda ve Boğa/Öküz "Yerli" sütununa, Küçükbaş ve Diğerleri (tek tırnaklı) tamamı "Yerli" sütununa eklendi (BBHB kuralında bunların ırk ayrımı yok).</div>`;
    }

    let _ek3aSeciliParselIdleri = new Set();

    /** "Parsel Seç" popup'ini acar - bu koy/mahalledeki TUM Mera parsellerini (dekar bilgisiyle) listeler. */
    window.ek3aParselSecPopupAc = async () => {
      const modal = new bootstrap.Modal(document.getElementById('ek3aParselSecModal'));
      modal.show();
      document.getElementById('ek3aParselSecSonuc').textContent = '';

      // Onceki secimden (varsa) kaldigi yerden devam - altAdim.veri.secilenParselIdleri.
      const altAdim = kayit.surec[seciliAna].altAdimlar[seciliAlt];
      _ek3aSeciliParselIdleri = new Set((altAdim.veri && altAdim.veri.secilenParselIdleri) || []);

      const params = new URLSearchParams({ il: kayit.il, ilce: kayit.ilce, koyMahalle: kayit.koyMahalle, durum: 'Aktif' });
      const json = await fetch(`/api/mera?${params}`).then((r) => r.json());
      const govde = document.getElementById('ek3aParselListesi');
      if (!json.success || !json.data.length) { govde.innerHTML = '<tr><td colspan="6" class="text-muted small">Bu köy/mahallede kayıtlı Mera parseli bulunamadı.</td></tr>'; return; }

      govde.innerHTML = json.data.map((p) => {
        const alanM2 = p.tapuAlaniM2 || p.meraAlaniM2 || 0;
        const dekar = (alanM2 / 1000).toLocaleString('tr-TR', { maximumFractionDigits: 2 });
        return `
          <tr>
            <td><input type="checkbox" class="form-check-input ek3a-parsel-check" value="${p._id}" ${_ek3aSeciliParselIdleri.has(p._id) ? 'checked' : ''}></td>
            <td>${guvenliMetin(p.adaNo || '-')}</td>
            <td>${guvenliMetin(p.parselNo || '-')}</td>
            <td>${guvenliMetin(p.araziNiteligi || '-')}</td>
            <td>${dekar}</td>
            <td>${guvenliMetin(p.mulkiyetDurumu || '-')}</td>
          </tr>`;
      }).join('');
    };

    window.ek3aParselSecKaydet = async () => {
      const sonucAlan = document.getElementById('ek3aParselSecSonuc');
      try {
        const parselIdleri = Array.from(document.querySelectorAll('.ek3a-parsel-check:checked')).map((c) => c.value);
        if (!parselIdleri.length) { sonucAlan.innerHTML = '<span class="text-danger">En az bir parsel seçin.</span>'; return; }

        sonucAlan.innerHTML = '<span class="text-muted">Hesaplanıyor...</span>';
        const res = await fetch(`${API}/${id}/ek3a-arazi-verileri-kaydet`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ anaAdimIndex: seciliAna, altAdimIndex: seciliAlt, parselIdleri }),
        });
        const json = await res.json();
        if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger">${json.message}</span>`; return; }
        kayit = json.data;

        const guncelAlt = kayit.surec[seciliAna].altAdimlar[seciliAlt];
        if (!guncelAlt.veri || !guncelAlt.veri.madde7Satirlari) {
          // Backend BASARILI dondu ama beklenen veri sekli GELMEDI -
          // bu durumu SESSIZCE GECMEK YERINE GORUNUR hale getiriyoruz.
          sonucAlan.innerHTML = '<span class="text-danger">Kayıt başarılı görünüyor ama tablo verisi beklenen biçimde dönmedi - lütfen sayfayı yenileyip tekrar deneyin ve bu durumu bildirin.</span>';
          console.error('ek3aParselSecKaydet: beklenmeyen yanıt biçimi', guncelAlt);
          return;
        }
        document.getElementById('e3aMadde7Tablosu').innerHTML = guncelAlt.veri.madde7Satirlari
          .map((satir) => `<tr><th class="table-light">${guvenliMetin(satir[0])}</th><td>${guvenliMetin(satir[1])}</td><td>${guvenliMetin(satir[2])}</td><td>${guvenliMetin(satir[3])}</td><td>${guvenliMetin(satir[4])}</td></tr>`).join('');
        document.getElementById('e3aMadde7Sonuc').innerHTML = `<span class="text-success">${parselIdleri.length} parsel seçilerek hesaplandı ve kaydedildi.</span>`;
        ek3aMadde10Goster(guncelAlt.veri);

        bootstrap.Modal.getInstance(document.getElementById('ek3aParselSecModal')).hide();
        renderSurec();
      } catch (hata) {
        console.error('Parsel seçimi kaydedilirken hata:', hata);
        sonucAlan.innerHTML = `<span class="text-danger">Beklenmeyen bir hata oluştu: ${guvenliMetin(hata.message)}</span>`;
      }
    };

    window.ek3aKaydet = async () => {
      const sonucAlan = document.getElementById('e3aSonuc');
      try {
        const aileSayisi = document.getElementById('e3aAileSayisi').value;
        const bbhbSonucId = document.getElementById('e3aBbhbSelect').value;

        sonucAlan.innerHTML = '<span class="text-muted small">Kaydediliyor...</span>';

        // Madde 8 (Buyukbas/Kucukbas/Digerleri x Kultur/Melez/Yerli) -
        // AYRI backend fonksiyonu (ek4bVeriCek'ten FARKLI format).
        let hayvanVerisi = {};
        if (bbhbSonucId) {
          const res = await fetch(`${API}/${id}/ek3a-hayvan-varligi-cek`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ anaAdimIndex: seciliAna, altAdimIndex: seciliAlt, bbhbSonucId }),
          });
          const json = await res.json();
          if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger small">${json.message}</span>`; return; }
          kayit = json.data;
          const guncelAlt = kayit.surec[seciliAna].altAdimlar[seciliAlt];
          hayvanVerisi = { bbhbSonucId, bbhbBolumIndex: guncelAlt.veri.bbhbBolumIndex, hayvanVarligiTablosu: guncelAlt.veri.hayvanVarligiTablosu, bbhbToplam: guncelAlt.veri.bbhbToplam };
        }

        // Madde 7 (Mera Modulu'nden secilen parseller) - AYRI bir popup'ta
        // ("Parsel Sec") KAYDEDILIYOR, AMA BU FONKSIYON (genel "Kaydet")
        // altAdim.veri'yi TAMAMEN UZERINE YAZDIGI icin (backend'deki
        // adimVeriKaydet TAM OVERWRITE yapiyor) - madde7Satirlari BURAYA
        // ACIKCA GERI EKLENMEZSE, kullanici Parsel Sec'ten SONRA ana
        // Kaydet'e bastiginda madde 7 verisi SESSIZCE SILINIR.
        const oncekiAltAdim = kayit.surec[seciliAna].altAdimlar[seciliAlt];
        const oncekiVeri = (oncekiAltAdim && oncekiAltAdim.veri) || {};
        const madde7Verisi = {};
        if (oncekiVeri.madde7Satirlari) madde7Verisi.madde7Satirlari = oncekiVeri.madde7Satirlari;
        if (oncekiVeri.secilenParselIdleri) madde7Verisi.secilenParselIdleri = oncekiVeri.secilenParselIdleri;

        const veri = {
          aileSayisi: aileSayisi ? Number(aileSayisi) : null,
          cksSonucId: document.getElementById('e3aCksSelect').value || null,
          ciftciAileSayisi: _ek3aSeciliCks ? _ek3aSeciliCks.ciftciler.length : null,
          araziModulundenGelecek: true,
          ...hayvanVerisi,
          ...madde7Verisi,
          yararlanmaSekilleri: Array.from(document.querySelectorAll('.e3a-yararlanma-check:checked')).map((c) => c.value),
          digerYararlanmaSekli: document.getElementById('e3aDigerYararlanma').value.trim(),
          haritaModulundenGelecek: true,
          madde11Notu: document.getElementById('e3aMadde11').value.trim(),
          madde12Metni: document.getElementById('e3aMadde12').value.trim(),
        };

        const res2 = await fetch(`${API}/${id}/adim-veri`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ anaAdimIndex: seciliAna, altAdimIndex: seciliAlt, veri }),
        });
        const json2 = await res2.json();
        if (!json2.success) { sonucAlan.innerHTML = `<span class="text-danger small">${json2.message}</span>`; return; }
        kayit = json2.data;
        renderSurec();
        sonucAlan.innerHTML = '<span class="text-success small"><i class="bi bi-check-circle me-1"></i>Kaydedildi.</span>';
        if (hayvanVerisi.hayvanVarligiTablosu) ek3aBbhbOnizlemeGoster(hayvanVerisi);
        document.getElementById('e3aDisaAktarAlani').innerHTML = `
          <a class="btn btn-sm btn-outline-secondary" href="${API}/${id}/adim-disa-aktar/${seciliAna}/${seciliAlt}/word"><i class="bi bi-file-earmark-word me-1"></i>Word</a>
        <a class="btn btn-sm btn-outline-secondary" href="${API}/${id}/adim-disa-aktar/${seciliAna}/${seciliAlt}/pdf"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</a>`;
      } catch (hata) {
        // Beklenmeyen bir hata olursa "Kaydediliyor..." da SONSUZA
        // KADAR TAKILI KALMAZ - GORUNUR bir hata mesaji gosterilir
        // (kullanicinin "hiçbir şey olmuyor" seklindeki bildirimlerini
        // TESHIS EDILEBILIR hale getirmek icin eklendi).
        console.error('Ek-3/a kaydedilirken hata:', hata);
        sonucAlan.innerHTML = `<span class="text-danger small">Beklenmeyen bir hata oluştu: ${guvenliMetin(hata.message)}</span>`;
      }
    };

    // "Formu doldurmadan tamamla" - genel (Duyuru/Duyuru Tutanağı gibi
    // adimlar icin) - ILERIDE kullanici yetkilerinde GATE EDILECEK.
    window.genelIslemsizTamamla = async () => {
      if (!confirm('Bu adımı, formu doldurmadan tamamlandı olarak işaretlemek istediğine emin misin?')) return;
      await adimKaydetIslemsiz();
    };

    // ---- MANUEL (varsayılan) panel ----
    function renderManuelPaneli(alt) {
      document.getElementById('veriPaneliGovde').innerHTML = `
        <p class="text-muted small">
          Bu adım için veri girişi ekranı ileride buraya eklenecek.
          Şimdilik adımı manuel olarak tamamlandı işaretleyip not
          ekleyebilirsin - istediğin zaman güncelleyebilirsin.
        </p>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="tamamlandiSwitch" ${alt.tamamlandiMi ? 'checked' : ''} style="width:2.5em;height:1.3em;">
          <label class="form-check-label" for="tamamlandiSwitch">Bu adım tamamlandı</label>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Not (opsiyonel)</label>
          <textarea class="form-control" id="adimNotu" rows="3">${guvenliMetin(alt.not || '')}</textarea>
        </div>
        ${alt.tamamlandiMi ? `<div class="small text-muted mb-3"><i class="bi bi-clock-history me-1"></i>Tamamlanma tarihi: ${tarihFormatla(alt.tamamlanmaTarihi)}</div>` : ''}
        <button class="btn btn-primary btn-sm" onclick="adimKaydet()">Kaydet</button>
        <div id="adimKaydetSonuc" class="mt-2"></div>
      `;
    }

    window.adimKaydet = async () => {
      const tamamlandiMi = document.getElementById('tamamlandiSwitch').checked;
      const not = document.getElementById('adimNotu').value;
      const sonucAlan = document.getElementById('adimKaydetSonuc');
      sonucAlan.innerHTML = '<span class="text-muted small">Kaydediliyor...</span>';

      const res = await fetch(`${API}/${id}/adim`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ anaAdimIndex: seciliAna, altAdimIndex: seciliAlt, tamamlandiMi, not }),
      });
      const json = await res.json();
      if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger small">${json.message}</span>`; return; }

      kayit = json.data;
      renderSurec();
      renderVeriPaneli();
      sonucAlan.innerHTML = '<span class="text-success small"><i class="bi bi-check-circle me-1"></i>Kaydedildi.</span>';
    };

    // ---- EK-4/A panel: SADECE ÇKS seç (ya da "kayıtlı kimse yok" işaretle) ----
    async function renderEk4aPaneli(alt) {
      const govde = document.getElementById('veriPaneliGovde');
      govde.innerHTML = `
        <p class="text-muted small">Bu köy için ÇKS (Çiftçi Kayıt Sistemi) kaydını seç - aile/çiftçi ailesi ve ekiliş/geçim kaynağı bilgisi buradan alınacak.</p>
        <div class="mb-2">
          <label class="form-label small fw-semibold">ÇKS Kaydı</label>
          <select id="ek4aCksSelect" class="form-select form-select-sm"><option value="">Yükleniyor...</option></select>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="ek4aAtlandiCheck" ${alt.veri && alt.veri.atlandiMi ? 'checked' : ''} onchange="ek4aAtlaGoster(this.checked)">
          <label class="form-check-label small" for="ek4aAtlandiCheck">ÇKS'ye kayıtlı kimse bulunmamaktadır (bu adımı atla)</label>
        </div>
        <button class="btn btn-primary btn-sm" onclick="ek4aVeriCekVeKaydet()">Kaydet</button>
        <div id="ek4aSonuc" class="mt-2"></div>
        <div id="ek4aOnizleme" class="mt-3"></div>
      `;

      const cksJson = await fetch(`${API}/cks-adaylari?il=${encodeURIComponent(kayit.il)}&ilce=${encodeURIComponent(kayit.ilce)}&koyMahalle=${encodeURIComponent(kayit.koyMahalle)}`).then((r) => r.json());
      const cksSelect = document.getElementById('ek4aCksSelect');
      cksSelect.innerHTML = (cksJson.success && cksJson.data.length)
        ? cksJson.data.map((c) => `<option value="${c._id}" ${alt.kaynakCksSonucId === c._id ? 'selected' : ''}>${c.uretimYili || '-'} üretim yılı · ${c.ciftciler.length} çiftçi</option>`).join('')
        : '<option value="">Kayıt bulunamadı</option>';

      ek4aAtlaGoster(alt.veri && alt.veri.atlandiMi);
      if (alt.veri && !alt.veri.atlandiMi && alt.veri.ciftciler && alt.veri.ciftciler.length) renderEk4aOnizleme(alt.veri);
    }

    window.ek4aAtlaGoster = (atlandiMi) => {
      document.getElementById('ek4aCksSelect').disabled = atlandiMi;
    };

    function renderEk4aOnizleme(veri) {
      if (veri.atlandiMi) {
        document.getElementById('ek4aOnizleme').innerHTML = '<div class="text-muted small">Bu köyde ÇKS\'ye kayıtlı kimse bulunmadığı için adım atlandı.</div>';
        return;
      }
      document.getElementById('ek4aOnizleme').innerHTML = `
        <div class="small text-muted mb-1">${veri.ciftciler.length} çiftçi</div>
        <table class="table table-sm">
          <thead><tr><th>İşletmeci</th><th>Yem Bitkisi</th><th>Sebze</th><th>Hububat</th></tr></thead>
          <tbody>${veri.ciftciler.map((c) => `<tr><td>${guvenliMetin(c.isletmeciAdi)}</td><td>${c.yemBitkisi ?? '-'}</td><td>${c.sebzeBag ?? '-'}</td><td>${c.hububat ?? '-'}</td></tr>`).join('')}</tbody>
        </table>
      `;
    }

    window.ek4aVeriCekVeKaydet = async () => {
      const atlandi = document.getElementById('ek4aAtlandiCheck').checked;
      const cksSonucId = document.getElementById('ek4aCksSelect').value;
      const sonucAlan = document.getElementById('ek4aSonuc');
      if (!atlandi && !cksSonucId) { sonucAlan.innerHTML = '<span class="text-danger small">ÇKS kaydı seçilmeli veya "kayıtlı kimse yok" işaretlenmelidir.</span>'; return; }
      sonucAlan.innerHTML = '<span class="text-muted small">Kaydediliyor...</span>';

      const res = await fetch(`${API}/${id}/ek4a-veri-cek`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ anaAdimIndex: seciliAna, altAdimIndex: seciliAlt, cksSonucId: atlandi ? null : cksSonucId, atlandi }),
      });
      const json = await res.json();
      if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger small">${json.message}</span>`; return; }

      kayit = json.data;
      renderSurec();
      sonucAlan.innerHTML = '<span class="text-success small"><i class="bi bi-check-circle me-1"></i>Kaydedildi.</span>';
      renderEk4aOnizleme(kayit.surec[seciliAna].altAdimlar[seciliAlt].veri);
    };

    // ---- EK-4/B panel: BBHB seç, kategori toplamlarını üret ----
    async function renderEk4bPaneli(alt) {
      const govde = document.getElementById('veriPaneliGovde');
      govde.innerHTML = `
        <p class="text-muted small">Bu köy için BBHB kaydını seç - köy düzeyinde Kültür/Kültür Melezi/Yerli × İnek/Dana-Düve ve Küçükbaş toplamları üretilecek.</p>
        <div class="mb-2">
          <label class="form-label small fw-semibold">BBHB Kaydı *</label>
          <select id="ek4bBbhbSelect" class="form-select form-select-sm"><option value="">Yükleniyor...</option></select>
        </div>
        <button class="btn btn-primary btn-sm" onclick="ek4bVeriCekVeKaydet()">Veri Çek ve Kaydet</button>
        <div id="ek4bSonuc" class="mt-2"></div>
        <div id="ek4bOnizleme" class="mt-3"></div>
      `;

      const bbhbJson = await fetch(`${API}/bbhb-adaylari?il=${encodeURIComponent(kayit.il)}&ilce=${encodeURIComponent(kayit.ilce)}&koyMahalle=${encodeURIComponent(kayit.koyMahalle)}`).then((r) => r.json());
      const bbhbSelect = document.getElementById('ek4bBbhbSelect');
      bbhbSelect.innerHTML = (bbhbJson.success && bbhbJson.data.length)
        ? bbhbJson.data.map((b) => `<option value="${b._id}" ${alt.kaynakBbhbSonucId === b._id ? 'selected' : ''}>${tarihFormatla(b.hesaplamaTarihi)} · Toplam BBHB: ${b.bolumToplamBBHB.toFixed(2)}</option>`).join('')
        : '<option value="">Kayıt bulunamadı</option>';

      if (alt.veri) renderEk4bOnizleme(alt.veri);
    }

    function renderEk4bOnizleme(veri) {
      const t = veri.kategoriToplamlari;
      document.getElementById('ek4bOnizleme').innerHTML = `
        <table class="table table-sm">
          <thead><tr><th></th><th>İnek</th><th>Dana-Düve</th></tr></thead>
          <tbody>
            <tr><th>Kültür</th><td>${t.kulturIrki.inek}</td><td>${t.kulturIrki.duveDana}</td></tr>
            <tr><th>Kültür Melezi</th><td>${t.kulturMelezi.inek}</td><td>${t.kulturMelezi.duveDana}</td></tr>
            <tr><th>Yerli</th><td>${t.yerliIrk.inek}</td><td>${t.yerliIrk.duveDana}</td></tr>
          </tbody>
        </table>
        <table class="table table-sm">
          <thead><tr><th>Küçükbaş</th><th>Koyun</th><th>Keçi</th></tr></thead>
          <tbody><tr><td></td><td>${t.kucukbas.koyun}</td><td>${t.kucukbas.kec}</td></tr></tbody>
        </table>
        <div class="small text-muted">Toplam BBHB: ${veri.bbhbToplam.toFixed(2)}</div>
      `;
    }

    window.ek4bVeriCekVeKaydet = async () => {
      const bbhbSonucId = document.getElementById('ek4bBbhbSelect').value;
      const sonucAlan = document.getElementById('ek4bSonuc');
      if (!bbhbSonucId) { sonucAlan.innerHTML = '<span class="text-danger small">BBHB kaydı seçilmelidir.</span>'; return; }
      sonucAlan.innerHTML = '<span class="text-muted small">Hesaplanıyor...</span>';

      const res = await fetch(`${API}/${id}/ek4b-veri-cek`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ anaAdimIndex: seciliAna, altAdimIndex: seciliAlt, bbhbSonucId }),
      });
      const json = await res.json();
      if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger small">${json.message}</span>`; return; }

      kayit = json.data;
      renderSurec();
      sonucAlan.innerHTML = '<span class="text-success small"><i class="bi bi-check-circle me-1"></i>Kaydedildi.</span>';
      renderEk4bOnizleme(kayit.surec[seciliAna].altAdimlar[seciliAlt].veri);
    };

    // ---- BİRLEŞTİRME panel: 4a+4b'den GERÇEK bir Ek-4ab kaydı üret ----
    function renderBirlestirPaneli() {
      const altAdimlar = kayit.surec[seciliAna].altAdimlar;
      const bulunanAdim = altAdimlar[seciliAlt];
      const ek4a = altAdimlar.find((a) => a.tip === 'ek4a');
      const ek4b = altAdimlar.find((a) => a.tip === 'ek4b');
      const govde = document.getElementById('veriPaneliGovde');

      const ek4aHazir = ek4a && ek4a.tamamlandiMi;
      const ek4bHazir = ek4b && ek4b.tamamlandiMi;

      govde.innerHTML = `
        <p class="text-muted small">
          Ek-4/b'de seçilen BBHB verisi TEMEL alınarak, içlerinden
          Ek-4/a'daki ÇKS kaydıyla eşleşenler birleştirilip mevcut
          <a href="/ek4ab/" target="_blank">Ek-4ab (Birleşik Cetvel)</a>
          modülüyle AYNI formatta gerçek bir kayıt üretilecek ve bu 3T
          kaydına otomatik bağlanacak.
        </p>
        <div class="d-flex gap-2 mb-3">
          <span class="badge ${ek4aHazir ? 'bg-success' : 'bg-secondary'}">${ek4aHazir ? '✓' : '…'} Ek-4/a</span>
          <span class="badge ${ek4bHazir ? 'bg-success' : 'bg-secondary'}">${ek4bHazir ? '✓' : '…'} Ek-4/b</span>
        </div>
        ${(ek4aHazir && ek4bHazir) ? `
          <button class="btn btn-primary btn-sm" onclick="birlestirVeDevamEt()">Birleştir ve Ek-4ab Oluştur</button>
        ` : `<div class="alert alert-warning small py-2">Önce Ek-4/a ve Ek-4/b tamamlanmalı.</div>`}
        <div id="birlestirSonuc" class="mt-2"></div>
      `;

      if (bulunanAdim.tamamlandiMi && bulunanAdim.veri && bulunanAdim.veri.ek4abKaydiId) {
        document.getElementById('birlestirSonuc').innerHTML = `
          <div class="alert alert-success small py-2 mt-2">
            <i class="bi bi-check-circle me-1"></i>Ek-4ab kaydı oluşturuldu (${bulunanAdim.veri.ciftciSayisi} çiftçi, toplam BBHB: ${bulunanAdim.veri.genelToplamBBHB.toFixed(2)}).
            <a href="/ek4ab/?id=${bulunanAdim.veri.ek4abKaydiId}" target="_blank">Görüntüle →</a>
          </div>`;
      }
    }

    window.birlestirVeDevamEt = async () => {
      const sonucAlan = document.getElementById('birlestirSonuc');
      sonucAlan.innerHTML = '<span class="text-muted small">Birleştiriliyor...</span>';
      const res = await fetch(`${API}/${id}/birlestir`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ anaAdimIndex: seciliAna, altAdimIndex: seciliAlt }),
      });
      const json = await res.json();
      if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger small">${json.message}</span>`; return; }
      kayit = json.data;
      renderSurec();
      renderBirlestirPaneli();
    };

    window.silKayit = async () => {
      if (!confirm('Bu 3T kaydını silmek istediğine emin misin?')) return;
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
      const json = await res.json();
      if (json.success) window.location.href = '/uc-t/';
      else alert(json.message);
    };

        /** Surecte İLK TAMAMLANMAMIŞ alt adımı bulup otomatik secer - "son kaldigi yerden devam" */
    function sonKalinanAdimiSecVeAc() {
      for (let ai = 0; ai < kayit.surec.length; ai++) {
        const altAdimlar = kayit.surec[ai].altAdimlar;
        for (let alti = 0; alti < altAdimlar.length; alti++) {
          if (!altAdimlar[alti].tamamlandiMi) {
            seciliAna = ai; seciliAlt = alti;
            return;
          }
        }
      }
      // Hepsi tamamlanmis - son adimi goster (tamamlanmis haliyle)
      const sonAna = kayit.surec.length - 1;
      if (sonAna >= 0) {
        seciliAna = sonAna;
        seciliAlt = kayit.surec[sonAna].altAdimlar.length - 1;
      }
    }

    async function yukle() {
      const res = await fetch(`${API}/${id}`);
      const json = await res.json();
      if (!json.success) { document.getElementById('bBaslik').textContent = 'Bulunamadı'; return; }
      kayit = json.data;
      document.getElementById('bBaslik').textContent = `${kayit.il} / ${kayit.ilce} / ${kayit.koyMahalle}`;
      document.title = `${kayit.koyMahalle} - 3T - MİS`;
      if (seciliAna === null) sonKalinanAdimiSecVeAc(); // SADECE ilk yuklemede - kullanicinin sonraki tiklamalarini EZME
      renderSurec();
      renderVeriPaneli();
    }
    yukle();
  </script>

  <!-- Ek-3/a Madde 7 - "Parsel Seç" Popup'ı (Mera Modulu entegrasyonu) -->
  <div class="modal fade" id="ek3aParselSecModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header py-2">
          <h6 class="modal-title">Parsel Seç - Mera Modülü</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small">Bu köy/mahalledeki Mera Modülü parselleri aşağıda listelenmiştir - işaretleyerek seçin, "Kaydet" ile Madde 7 tablosuna hesaplanarak eklenir.</p>
          <div class="table-responsive">
            <table class="table table-sm">
              <thead><tr><th style="width:30px;"></th><th>Ada</th><th>Parsel</th><th>Cinsi</th><th>Dekar</th><th>Mülkiyet Durumu</th></tr></thead>
              <tbody id="ek3aParselListesi"><tr><td colspan="6" class="text-muted small">Yükleniyor...</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer py-2">
          <span id="ek3aParselSecSonuc" class="small me-auto"></span>
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Vazgeç</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="ek3aParselSecKaydet()">Kaydet</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
