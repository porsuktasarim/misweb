<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parsel Detayı - Mera Modülü</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link href="/assets/css/layout.css?v=12" rel="stylesheet" />
  <style>
    .not-karti { border: 1px solid #e5e5e5; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .not-versiyon { background: #f8f9fa; border-left: 3px solid #d8d8d8; padding: 6px 10px; margin-top: 6px; font-size: 12px; color: #666; }
    #haritaKonteyner { height: 420px; border-radius: 6px; overflow: hidden; border: 1px solid var(--renk-kenarlik, #e0e0e0); }
    /* Katman kontrol paneli - Leaflet'in KENDI control mekanizmasiyla
       eklenir, bu yuzden hem normal HEM tam ekran gorunumde OTOMATIK
       calisir (harita konteynerinin ICINDEKI DOM agacinda yasar).
       MINIMAL: kompakt, sadece gerektiginde genisleyen bir kutu. */
    .harita-katman-kontrol {
      background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      padding: 6px 8px; font-size: 11px; max-width: 200px;
    }
    .harita-katman-satiri { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
    .harita-katman-noktasi { width: 11px; height: 11px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,0.2); }
    .harita-katman-stil-paneli { background: #fff; border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,0.35); padding: 8px; font-size: 11px; width: 170px; }
    .harita-katman-stil-paneli label { font-size: 10px; margin-bottom: 2px; display: block; }
    .harita-katman-stil-paneli input[type="color"] { width: 100%; height: 24px; padding: 1px; }
  </style>
</head>
<body>

  <div class="mis-kabuk" id="mis-kabuk">
    <div class="mis-marka" id="mis-marka"></div>
    <div class="mis-ustcubuk" id="mis-ustcubuk"></div>
    <nav class="mis-anamenu" id="mis-anamenu"></nav>

    <div class="mis-icerik">
      <div class="mis-icerik-birincil">
        <div class="mis-panel">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <h2 id="baslikAlani"></h2>
              <a href="/mera/" class="small" id="txtListeyeDon"></a>
            </div>

              <label class="form-label small fw-semibold mb-1" id="txtKullaniciAdiniz"></label>
              <input type="text" class="form-control form-control-sm" id="kullaniciAdiInput">
            </div>
          </div>

          <ul class="nav nav-tabs mb-3">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#genel-tab" id="txtSekmeGenel"></button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#notlar-tab" id="txtSekmeNotlar"></button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#log-tab" id="txtSekmeLog"></button></li>
          </ul>

          <div class="tab-content">
            <!-- Harita SADECE Genel Bilgiler sekmesinde gorunur (kullanicinin
                 acik istegi) - Notlar/Log sekmelerinde YOK, o yuzden
                 row/col bolunmesi SADECE bu tab-pane'in ICINDE. -->
            <div class="tab-pane fade show active" id="genel-tab">
              <div class="row g-3">
                <div class="col-lg-7">
                  <div class="row g-2 mb-2">
                    <div class="col-md-4"><label class="form-label small fw-semibold" id="lblIl"></label><select id="gIl" class="form-select form-select-sm"></select></div>
                    <div class="col-md-4"><label class="form-label small fw-semibold" id="lblIlce"></label><select id="gIlce" class="form-select form-select-sm"></select></div>
                    <div class="col-md-4"><label class="form-label small fw-semibold" id="lblMahalle"></label><select id="gMahalle" class="form-select form-select-sm"></select></div>
                  </div>
                  <div class="row g-2 mb-2">
                    <div class="col-md-3"><label class="form-label small fw-semibold" id="lblAdaNo"></label><input class="form-control form-control-sm" id="gAdaNo"></div>
                    <div class="col-md-3"><label class="form-label small fw-semibold" id="lblParselNo"></label><input class="form-control form-control-sm" id="gParselNo"></div>
                    <div class="col-md-3"><label class="form-label small fw-semibold" id="lblMeraAlani"></label><input type="number" class="form-control form-control-sm" id="gMeraAlani"></div>
                    <div class="col-md-3"><label class="form-label small fw-semibold" id="lblTapuAlani"></label><input type="number" class="form-control form-control-sm" id="gTapuAlani"></div>
                  </div>
                  <div class="row g-2 mb-2">
                    <div class="col-md-3">
                      <label class="form-label small fw-semibold" id="lblAraziNiteligi"></label>
                      <select class="form-select form-select-sm" id="gAraziNiteligi"></select>
                    </div>
                    <div class="col-md-3">
                      <label class="form-label small fw-semibold" id="lblAraziDurumSinifi"></label>
                      <select class="form-select form-select-sm" id="gAraziDurumSinifi"></select>
                    </div>
                    <div class="col-md-3">
                      <label class="form-label small fw-semibold" id="lblAraziKaynagi"></label>
                      <select class="form-select form-select-sm" id="gAraziKaynagi"></select>
                    </div>
                    <div class="col-md-3">
                      <label class="form-label small fw-semibold" id="lblTopraksinifi"></label>
                      <select class="form-select form-select-sm" id="gTopraksinifi"></select>
                    </div>
                  </div>
                  <div class="row g-2 mb-2">
                    <div class="col-md-3"><label class="form-label small fw-semibold" id="lblIslahDurumu"></label><select class="form-select form-select-sm" id="gIslahDurumu"></select></div>
                    <div class="col-md-3"><label class="form-label small fw-semibold" id="lblEgimi"></label><input class="form-control form-control-sm" id="gEgimi"></div>
                    <div class="col-md-6"><label class="form-label small fw-semibold" id="lblTapuKimlikNo"></label><input class="form-control form-control-sm" id="gTapuKimlikNo"></div>
                  </div>

                  <div class="row g-2 mb-3">
                    <div class="col-md-4 p-2 border rounded me-2">
                      <div class="form-check"><input type="checkbox" class="form-check-input" id="gTespitYapildi"><label class="form-check-label small fw-semibold" for="gTespitYapildi" id="lblTespitYapildi"></label></div>
                      <input type="date" class="form-control form-control-sm mt-1" id="gTespitTarihi">
                    </div>
                    <div class="col-md-4 p-2 border rounded me-2">
                      <div class="form-check"><input type="checkbox" class="form-check-input" id="gTahditYapildi"><label class="form-check-label small fw-semibold" for="gTahditYapildi" id="lblTahditYapildi"></label></div>
                      <input type="date" class="form-control form-control-sm mt-1" id="gTahditTarihi">
                    </div>
                    <div class="col-md-3 p-2 border rounded">
                      <div class="form-check"><input type="checkbox" class="form-check-input" id="gTahsisYapildi"><label class="form-check-label small fw-semibold" for="gTahsisYapildi" id="lblTahsisYapildi"></label></div>
                      <input type="date" class="form-control form-control-sm mt-1" id="gTahsisTarihi">
                    </div>
                  </div>

                  <button class="btn btn-primary btn-sm" id="genelKaydetBtn"></button>
                  <span id="genelSonuc" class="small ms-2"></span>
                </div>

                <div class="col-lg-5">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0" id="txtHaritaBaslik"></h5>
                    <div class="btn-group btn-group-sm">
                      <button type="button" class="btn btn-outline-secondary" id="haritaKatmanBtn"></button>
                      <button type="button" class="btn btn-outline-secondary" id="haritaTamEkranBtn" title="Genişlet"><i class="bi bi-arrows-fullscreen"></i></button>
                    </div>
                  </div>

                  <div id="haritaKonteyner"></div>

                  <div class="row g-2 mt-2">
                    <div class="col-md-7">
                      <label class="form-label small" id="lblHaritaVersiyon"></label>
                      <select id="haritaVersiyonSecici" class="form-select form-select-sm"></select>
                    </div>
                    <div class="col-md-5 d-flex align-items-end">
                      <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="cevreParselGosterCheck">
                        <label class="form-check-label small" for="cevreParselGosterCheck" id="lblCevreParselGoster"></label>
                      </div>
                    </div>

                  <div class="mt-2">
                    <label class="btn btn-sm btn-outline-secondary mb-0">
                      <span id="lblHaritaDosyaYukle"></span>
                      <input type="file" class="d-none" id="haritaDosyaInput" accept=".geojson,.json,.kml,.gpx,.kmz">
                    </label>
                    <span id="haritaYukleSonuc" class="small ms-2"></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="tab-pane fade" id="notlar-tab">
              <div class="mb-3">
                <label class="form-label small fw-semibold" id="lblYeniNot"></label>
                <textarea class="form-control form-control-sm" id="yeniNotMetni" rows="2"></textarea>
                <button class="btn btn-primary btn-sm mt-2" id="notEkleBtn"></button>
                <span id="notEkleSonuc" class="small ms-2"></span>
              </div>
              <hr>
              <div id="notlarListesi"></div>
            </div>

            <div class="tab-pane fade" id="log-tab">
              <div class="table-responsive">
                <table class="table table-sm">
                  <thead><tr id="logTheadSatiri"></tr></thead>
                  <tbody id="logTablosu"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="mis-icerik-ikincil">
        <div class="mis-panel">
          <h5 id="txtVerimPanelBaslik"></h5>
          <p class="text-muted small" id="txtVerimPanelAciklama"></p>
          <div id="verimBilgisiAlani"></div>
        </div>
      </div>
    </div>

    <footer class="mis-footer" id="mis-footer"></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js"></script>
  <script src="/assets/js/mis-menu.js?v=13"></script>
  <script src="/assets/js/shell.js?v=13"></script>
  <script src="/assets/js/mis-yer-secici.js?v=13"></script>
  <script src="/assets/js/mis-lang.js?v=1"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
  <script>
    function guvenliMetin(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
    function tarihSaatFormatla(t) { return t ? new Date(t).toLocaleString('tr-TR') : '-'; }

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const API = '/api/mera';
    let kayit = null;
    let LANG = null;

    const kullaniciInput = document.getElementById('kullaniciAdiInput');

    async function sabitleriDoldur() {
      const json = await fetch(`${API}/sabitler`).then((r) => r.json());
      if (!json.success) return;
      const ekle = (selectId, degerler, ilkSecenekEkle) => {
        const sel = document.getElementById(selectId);
        if (ilkSecenekEkle) { const bos = document.createElement('option'); bos.value = ''; bos.textContent = '— Seç —'; sel.appendChild(bos); }
        degerler.forEach((d) => { const o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o); });
      };
      ekle('gAraziNiteligi', json.data.araziNitelikleri, true);
      ekle('gAraziKaynagi', json.data.araziKaynaklari, true);
      ekle('gTopraksinifi', json.data.topraksiniflari, true);
      ekle('gAraziDurumSinifi', json.data.araziDurumSiniflari, false);
      ekle('gIslahDurumu', json.data.islahDurumlari, false);
    }

    async function kaydiYukle() {
      if (!id) { document.getElementById('baslikAlani').textContent = LANG.mera.gecersizParsel; return; }
      const json = await fetch(`${API}/${id}`).then((r) => r.json());
      if (!json.success) { document.getElementById('baslikAlani').textContent = json.message; return; }
      kayit = json.data;
      document.getElementById('baslikAlani').textContent = `${kayit.il} / ${kayit.ilce} / ${kayit.koyMahalle} - ${LANG.mera.adaNo}:${kayit.adaNo || '-'} ${LANG.mera.parselNo}:${kayit.parselNo || '-'}`;

      const yerTs = await misYerSeciciKur({ ilSelectId: 'gIl', ilceSelectId: 'gIlce', mahalleSelectId: 'gMahalle' });
      yerTs.ilTs.setValue(kayit.il);
      await new Promise((r) => setTimeout(r, 300));
      yerTs.ilceTs.setValue(kayit.ilce);
      await new Promise((r) => setTimeout(r, 300));
      yerTs.mahalleTs.setValue(kayit.koyMahalle);

      document.getElementById('gAdaNo').value = kayit.adaNo || '';
      document.getElementById('gParselNo').value = kayit.parselNo || '';
      document.getElementById('gMeraAlani').value = kayit.meraAlaniM2 ?? '';
      document.getElementById('gTapuAlani').value = kayit.tapuAlaniM2 ?? '';
      document.getElementById('gAraziNiteligi').value = kayit.araziNiteligi || '';
      document.getElementById('gAraziDurumSinifi').value = kayit.araziDurumSinifi || 'Belirlenmemiş';
      document.getElementById('gAraziKaynagi').value = kayit.araziKaynagi || '';
      document.getElementById('gTopraksinifi').value = kayit.topraksinifi || '';
      document.getElementById('gIslahDurumu').value = kayit.islahDurumu || 'Islah Edilmedi';
      document.getElementById('gEgimi').value = kayit.egimi || '';
      document.getElementById('gTapuKimlikNo').value = kayit.tapuKimlikNo || '';
      document.getElementById('gTespitYapildi').checked = !!kayit.tespitYapildiMi;
      document.getElementById('gTespitTarihi').value = kayit.tespitTarihi ? kayit.tespitTarihi.slice(0, 10) : '';
      document.getElementById('gTahditYapildi').checked = !!kayit.tahditYapildiMi;
      document.getElementById('gTahditTarihi').value = kayit.tahditTarihi ? kayit.tahditTarihi.slice(0, 10) : '';
      document.getElementById('gTahsisYapildi').checked = !!kayit.tahsisYapildiMi;
      document.getElementById('gTahsisTarihi').value = kayit.tahsisTarihi ? kayit.tahsisTarihi.slice(0, 10) : '';

      notlariGoster();
      logGoster();
      verimBilgisiHesapla();
      haritaVersiyonlariniDoldur();
    }

    // ==================== HARİTA ALT-MODÜLÜ ====================
    // Kutuphaneler: Leaflet (OSM tabanli, KEY GEREKTIRMEZ) + Esri World
    // Imagery (uydu katmani, KEY GEREKTIRMEZ, makul kullanim icin
    // ucretsiz) + leaflet-omnivore (KML/GPX'i Leaflet katmanina cevirir
    // - SADECE GORUNTULEME icin, SAKLANAN dosya FORMATI DEGISMEZ).
    let _harita = null;
    let _osmKatmani = null;
    let _uyduKatmani = null;
    let _uyduAktifMi = false;
    let _aktifParselKatmanKaydi = null;
    let _cevreParselKatmanKayitlari = [];
    // Varsayilan katman stilleri - Gorunum Ayarlari'ndan (/api/belge-ayarlari)
    // cekilir; kullanici HARITADA tek tek katman uzerinde GECICI
    // (DB'ye kaydedilmez, oturum ici) degistirebilir.
    let _haritaVarsayilanStil = {
      ustKatman: { cizgiRengi: '#2e7d32', cizgiKalinligi: 3, doluMu: true, doluRengi: '#2e7d32' },
      altKatmanlar: { cizgiRengi: '#9e9e9e', cizgiKalinligi: 1.5, doluMu: false, doluRengi: '#9e9e9e' },
    };
    let _katmanIdSayaci = 0;

    function haritaBaslat() {
      if (_harita) return;
      _harita = L.map('haritaKonteyner').setView([39.0, 35.0], 6); // Turkiye geneli varsayilan gorunum

      _osmKatmani = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> katkıda bulunanlar',
        maxZoom: 19,
      }).addTo(_harita);

      _uyduKatmani = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 19,
      });

      // Katman kontrolu - Leaflet'in KENDI control mekanizmasi, harita
      // konteynerinin ICINDE yasar - bu yuzden hem NORMAL hem TAM EKRAN
      // gorunumde OTOMATIK calisir, ayri kod GEREKMEZ.
      const kontrol = L.control({ position: 'topright' });
      kontrol.onAdd = () => {
        const div = L.DomUtil.create('div', 'harita-katman-kontrol');
        div.id = 'haritaKatmanlarPaneli';
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      kontrol.addTo(_harita);
    }

    async function haritaVarsayilanStilleriYukle() {
      const json = await fetch('/api/belge-ayarlari').then((r) => r.json());
      if (json.success && json.data.haritaStili) {
        if (json.data.haritaStili.ustKatman) _haritaVarsayilanStil.ustKatman = json.data.haritaStili.ustKatman;
        if (json.data.haritaStili.altKatmanlar) _haritaVarsayilanStil.altKatmanlar = json.data.haritaStili.altKatmanlar;
      }
    }

    window.haritaKatmanDegistir = () => {
      if (!_harita) return;
      if (_uyduAktifMi) {
        _harita.removeLayer(_uyduKatmani);
        _osmKatmani.addTo(_harita);
      } else {
        _harita.removeLayer(_osmKatmani);
        _uyduKatmani.addTo(_harita);
      }
      _uyduAktifMi = !_uyduAktifMi;
      document.getElementById('haritaKatmanBtn').textContent = _uyduAktifMi ? LANG.mera.sokakGorunumu : LANG.mera.uyduGorunumu;
    };

    window.haritaTamEkranToggle = () => {
      // Genisletme, AYNI SAYFADA CSS ile buyutmek YERINE YENI BIR
      // SEKMEDE/PENCEREDE ozel bir tam-sayfa harita gorunumu ACAR
      // (kullanicinin acik tercihi: "pop-up ya da yeni sayfa"). Bu,
      // Leaflet haritasini DOM agaci icinde tasima KARMASIKLIGINDAN
      // (yeniden konumlandirma sonrasi olculerin BOZULMASI riskinden)
      // kacinir - AYRI, sade bir sayfa.
      window.open(`/mera/harita.html?id=${id}`, '_blank');
    };

    function haritaVersiyonlariniDoldur() {
      const secici = document.getElementById('haritaVersiyonSecici');
      const dosyalar = kayit.haritaDosyalari || [];
      if (!dosyalar.length) {
        secici.innerHTML = `<option value="">${LANG.mera.haritaDosyaYok}</option>`;
        return;
      }
      secici.innerHTML = dosyalar.map((d, i) => `<option value="${i}" ${i === dosyalar.length - 1 ? 'selected' : ''}>v${d.versiyonNo} - ${guvenliMetin(d.orijinalAd)} (${new Date(d.yuklemeTarihi).toLocaleDateString('tr-TR')})</option>`).join('');
      haritaSeciliVersiyonuGoster();
    }

    function haritaSeciliVersiyonuGoster() {
      const secici = document.getElementById('haritaVersiyonSecici');
      const dosyalar = kayit.haritaDosyalari || [];
      const index = Number(secici.value);
      if (Number.isNaN(index) || !dosyalar[index]) return;
      haritaDosyasiniCiz(dosyalar[index], LANG.mera.haritaBuParsel, 'ust');
    }

    /** Leaflet stil objesini KAYIT stilinden {cizgiRengi,cizgiKalinligi,doluMu,doluRengi} uretir. */
    function haritaLeafletStili(stilKaydi) {
      return {
        color: stilKaydi.cizgiRengi,
        weight: stilKaydi.cizgiKalinligi,
        fill: stilKaydi.doluMu,
        fillColor: stilKaydi.doluRengi,
        fillOpacity: stilKaydi.doluMu ? 0.25 : 0,
      };
    }

    /**
     * Bir harita dosyasini haritada CIZER ve "Katmanlar" listesine
     * EKLER (renk noktasina tiklanarak stil DUZENLENEBILIR). tip:
     * 'ust' (aktif parsel, TEK olur - ONCEKI ust katman KALDIRILIR)
     * veya 'alt' (cevre parsel, BIRDEN FAZLA olabilir).
     */
    function haritaDosyasiniCiz(dosyaKaydi, ad, tip) {
      if (!_harita || !dosyaKaydi) return;
      const varsayilanStilKaydi = tip === 'ust' ? _haritaVarsayilanStil.ustKatman : _haritaVarsayilanStil.altKatmanlar;
      const katmanId = `katman-${_katmanIdSayaci++}`;

      const katmanEklendiginde = (katman) => {
        const kayitObj = { id: katmanId, ad, tip, katman, stil: { ...varsayilanStilKaydi } };
        katman.setStyle ? katman.setStyle(haritaLeafletStili(kayitObj.stil)) : null;
        katman.addTo(_harita);

        if (tip === 'ust') {
          if (_aktifParselKatmanKaydi) _harita.removeLayer(_aktifParselKatmanKaydi.katman);
          _aktifParselKatmanKaydi = kayitObj;
          try { _harita.fitBounds(katman.getBounds(), { maxZoom: 16 }); } catch (e) { /* gecersiz geometri - sessizce gec */ }
        } else {
          _cevreParselKatmanKayitlari.push(kayitObj);
        }
        haritaKatmanListesiCiz();
      };

      // ONCELIK: yukleme sirasinda OTOMATIK uretilen GeoJSON turevi
      // varsa (geojsonYolu) HER ZAMAN O KULLANILIR - format ne olursa
      // olsun (KML/KMZ/GPX dahil) GARANTI CALISIR ve parsel bilgileri
      // (ıslah durumu vb.) ICINDE GOMULUDUR. YOKSA (ESKI kayitlar -
      // bu ozellik eklenmeden ONCE yuklenmis) eski format-bazli
      // mantiga (omnivore vb.) DUSULUR.
      if (dosyaKaydi.geojsonYolu) {
        fetch(`/${dosyaKaydi.geojsonYolu}`).then((r) => r.json()).then((geojson) => {
          katmanEklendiginde(L.geoJSON(geojson));
        }).catch((err) => console.error('GeoJSON okunamadı:', err));
        return;
      }

      const url = `/${dosyaKaydi.dosyaYolu}`;
      if (dosyaKaydi.formatTipi === 'geojson' || dosyaKaydi.formatTipi === 'json') {
        fetch(url).then((r) => r.json()).then((geojson) => {
          const katman = L.geoJSON(geojson);
          katmanEklendiginde(katman);
        }).catch((err) => console.error('GeoJSON okunamadı:', err));
      } else if (dosyaKaydi.formatTipi === 'kml') {
        const katman = omnivore.kml(url);
        katman.on('ready', () => katmanEklendiginde(katman));
      } else if (dosyaKaydi.formatTipi === 'gpx') {
        const katman = omnivore.gpx(url);
        katman.on('ready', () => katmanEklendiginde(katman));
      } else if (tip === 'ust') {
        // .kmz gibi DOGRUDAN GOSTERILEMEYEN formatlar (GeoJSON turevi de YOKSA) - dosya KAYITLI, sadece HARITADA CIZILEMIYOR.
        document.getElementById('haritaYukleSonuc').innerHTML = `<span class="text-muted">${LANG.mera.haritaFormatDesteklenmiyor}</span>`;
      }
    }

    /** "Katmanlar" listesini (ust + tum alt katmanlar) Leaflet control panelinde CIZER - her satirda tiklamali renk noktasi. */
    function haritaKatmanListesiCiz() {
      const panel = document.getElementById('haritaKatmanlarPaneli');
      if (!panel) return;
      const tumKatmanlar = [];
      if (_aktifParselKatmanKaydi) tumKatmanlar.push(_aktifParselKatmanKaydi);
      tumKatmanlar.push(..._cevreParselKatmanKayitlari);

      if (!tumKatmanlar.length) { panel.innerHTML = ''; return; }

      panel.innerHTML = `<div class="fw-semibold mb-1">${LANG.mera.haritaKatmanlar}</div>` + tumKatmanlar.map((k) => `
        <div class="harita-katman-satiri" data-katman-id="${k.id}">
          <span class="harita-katman-noktasi" style="background:${k.stil.cizgiRengi};"></span>
          <span>${guvenliMetin(k.ad)}</span>
        </div>`).join('');

      panel.querySelectorAll('.harita-katman-satiri').forEach((satir) => {
        satir.addEventListener('click', () => haritaKatmanStilPaneliAc(satir.dataset.katmanId, satir));
      });
    }

    function haritaKatmanKaydiBul(katmanId) {
      if (_aktifParselKatmanKaydi && _aktifParselKatmanKaydi.id === katmanId) return _aktifParselKatmanKaydi;
      return _cevreParselKatmanKayitlari.find((k) => k.id === katmanId);
    }

    /** Bir katmanin RENK/KALINLIK/DOLU-BOS stilini duzenlemek icin MINIMAL bir mini-panel acar (oturum ici, DB'ye kaydedilmez). */
    function haritaKatmanStilPaneliAc(katmanId, satirEl) {
      document.querySelectorAll('.harita-katman-stil-paneli').forEach((p) => p.remove());
      const kayitObj = haritaKatmanKaydiBul(katmanId);
      if (!kayitObj) return;

      const panel = document.createElement('div');
      panel.className = 'harita-katman-stil-paneli mt-1';
      panel.innerHTML = `
        <label>${LANG.mera.haritaCizgiRengi}</label>
        <input type="color" class="hks-cizgi-rengi" value="${kayitObj.stil.cizgiRengi}">
        <label class="mt-1">${LANG.mera.haritaCizgiKalinligi}</label>
        <input type="number" step="0.5" min="0.5" class="form-control form-control-sm hks-cizgi-kalinligi" value="${kayitObj.stil.cizgiKalinligi}">
        <div class="form-check mt-1">
          <input type="checkbox" class="form-check-input hks-dolu-mu" ${kayitObj.stil.doluMu ? 'checked' : ''}>
          <label class="form-check-label">${LANG.mera.haritaDoluMu}</label>
        </div>
        <label class="mt-1">${LANG.mera.haritaDoluluqRengi}</label>
        <input type="color" class="hks-dolu-rengi" value="${kayitObj.stil.doluRengi}">
        <button type="button" class="btn btn-sm btn-secondary w-100 mt-2 hks-kapat-btn">${LANG.mera.haritaKapat}</button>`;
      L.DomEvent.disableClickPropagation(panel);
      satirEl.after(panel);

      const uygula = () => {
        kayitObj.stil = {
          cizgiRengi: panel.querySelector('.hks-cizgi-rengi').value,
          cizgiKalinligi: Number(panel.querySelector('.hks-cizgi-kalinligi').value) || 1,
          doluMu: panel.querySelector('.hks-dolu-mu').checked,
          doluRengi: panel.querySelector('.hks-dolu-rengi').value,
        };
        kayitObj.katman.setStyle ? kayitObj.katman.setStyle(haritaLeafletStili(kayitObj.stil)) : null;
        haritaKatmanListesiCiz();
      };
      panel.querySelector('.hks-cizgi-rengi').addEventListener('input', uygula);
      panel.querySelector('.hks-cizgi-kalinligi').addEventListener('input', uygula);
      panel.querySelector('.hks-dolu-mu').addEventListener('change', uygula);
      panel.querySelector('.hks-dolu-rengi').addEventListener('input', uygula);
      panel.querySelector('.hks-kapat-btn').addEventListener('click', () => panel.remove());
    }

    // ---- VERİM BİLGİLERİ / OTLATMA KAPASİTESİ ----
    // ONEMLI: backend (meraVerimAyarlari.service.js) GERCEKTE su
    // sekli donduruyor: { hesaplanabilir, yagisKusagi, dekar,
    // donemGunSayisi, tablo1YararlanilabilirYesil, tablo2UretilenYesil,
    // tablo3UretilenKuru, yararlanilabilirKuru, gunlukBbhb, donemlikBbhb }.
    // TASARIM (kullanicinin acik karari): 5 KUTUCUK, TEK bir kutu icinde -
    // ilk 4 kutucuk SADECE VERIM (kg/da + toplam kg), KENDI BBHB'leri YOK;
    // 5. kutucuk TEK, AYRI bir BBHB hesabi - SADECE Tablo-1 (Yararlanilabilir
    // Yesil Ot) uzerinden. Gerekce: "aynı yerdeki otları aynı miktardaki
    // hayvan kullanabilir, kuru ya da yeşil olması tüketimdeki tercih
    // biçimi" - yani KAPASITE TEKTIR, digerleri sadece VERIM KARSILASTIRMASI.
    async function verimBilgisiHesapla() {
      const alan = document.getElementById('verimBilgisiAlani');
      // Tapu Alani ONCELIKLIDIR (daha kesin/resmi kabul edilir) - BOS ise
      // Mera Alani'na DUSULUR (kullanicinin acik istegi).
      const hesaplamaAlaniM2 = kayit.tapuAlaniM2 || kayit.meraAlaniM2;
      if (!hesaplamaAlaniM2) { alan.innerHTML = `<p class="text-muted small">${LANG.mera.verimAlanGerekli}</p>`; return; }

      try {
        const params = new URLSearchParams({ il: kayit.il, araziDurumSinifi: kayit.araziDurumSinifi || '', alanM2: hesaplamaAlaniM2 });
        const json = await fetch(`/api/mera-verim-ayarlari/hesapla?${params}`).then((r) => r.json());
        if (!json.success) { alan.innerHTML = `<p class="text-danger small">${json.message}</p>`; return; }
        const v = json.data;

        if (!v.hesaplanabilir) { alan.innerHTML = `<p class="text-warning small">${v.mesaj}</p>`; return; }

        const verimKutusu = (baslik, t) => `
          <div class="col">
            <div class="border rounded p-2 h-100">
              <div class="small fw-semibold mb-1">${baslik}</div>
              <div class="small">${(t?.kgDa ?? 0).toLocaleString('tr-TR')} ${LANG.mera.kgDa}</div>
              <div class="small text-muted">${LANG.mera.toplam}: ${(t?.toplamKg ?? 0).toLocaleString('tr-TR')} kg</div>
            </div>
          </div>`;

        alan.innerHTML = `
          <div class="small mb-2">
            <div><strong>${LANG.mera.yagisKusagi}:</strong> ${guvenliMetin(v.yagisKusagi)} mm</div>
            <div><strong>${LANG.mera.donem}:</strong> ${v.donemGunSayisi} gün</div>
            <div><strong>${LANG.mera.meraAlaniKisa}:</strong> ${v.dekar} da</div>
          </div>
          <div class="row row-cols-1 g-2">
            ${verimKutusu(LANG.mera.tablo1Ad, v.tablo1YararlanilabilirYesil)}
            ${verimKutusu(LANG.mera.tablo2Ad, v.tablo2UretilenYesil)}
            ${verimKutusu(LANG.mera.tablo3Ad, v.tablo3UretilenKuru)}
            ${verimKutusu(LANG.mera.yararlanilabilirKuruAd, v.yararlanilabilirKuru)}
            <div class="col">
              <div class="border rounded p-2 h-100 bg-success-subtle">
                <div class="small fw-semibold mb-1">${LANG.mera.kapasiteBaslik}</div>
                <div class="small"><strong>${LANG.mera.gunlukBbhb}:</strong> ${(v.gunlukBbhb ?? 0).toFixed(2)}</div>
                <div class="small"><strong>${LANG.mera.otlatmaKapasitesiDonemlik}:</strong> ${(v.donemlikBbhb ?? 0).toFixed(2)}</div>
              </div>
            </div>
          </div>
          <p class="text-muted small mb-0 mt-2">${LANG.mera.otlatmaKapasitesiNotu}</p>`;
      } catch (hata) {
        // Beklenmeyen bir hata olursa panel "Yükleniyor..." da SONSUZA
        // KADAR TAKILI KALMAZ - GORUNUR bir hata mesaji gosterilir.
        console.error('Verim bilgisi hesaplanamadı:', hata);
        alan.innerHTML = `<p class="text-danger small">Verim bilgisi hesaplanırken beklenmeyen bir hata oluştu: ${guvenliMetin(hata.message)}</p>`;
      }
    }

        });
        const json = await res.json();
        if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger">${json.message}</span>`; return; }
        kayit = json.data;
        document.getElementById('yeniNotMetni').value = '';
        sonucAlan.innerHTML = `<span class="text-success">${LANG.ortak.eklendi}</span>`;
        notlariGoster();
        logGoster();
      });

      misKabuguBaslat('mera', `${LANG.mera.kisaAd}<span class="ayrac">/</span>${LANG.mera.parselDetayi}`);
      await sabitleriDoldur();
      await kaydiYukle();
    }

    baslat();
  </script>
</body>
</html>
