<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mera Modülü - Mera İzleme Sistemi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet" />
  <link href="/assets/css/layout.css?v=12" rel="stylesheet" />
  <style>
    .mera-durum-rozet { font-size: 11px; }
  </style>
</head>
<body>

  <div class="mis-kabuk" id="mis-kabuk">
    <div class="mis-marka" id="mis-marka"></div>
    <div class="mis-ustcubuk" id="mis-ustcubuk"></div>
    <nav class="mis-anamenu" id="mis-anamenu"></nav>

    <div class="mis-icerik">
      <div class="mis-icerik-birincil">
        <div class="mis-panel">
          <h2 id="txtBaslikListe"></h2>
          <p class="text-muted small" id="txtAciklamaListe"></p>

          <div class="d-flex gap-2 mb-3 flex-wrap">
            <a class="btn btn-outline-secondary btn-sm" href="/api/mera/sablon-indir"><i class="bi bi-download me-1"></i><span id="txtSablonIndirBtn"></span></a>
            <label class="btn btn-outline-secondary btn-sm mb-0">
              <i class="bi bi-upload me-1"></i><span id="txtTopluYukleBtn"></span>
              <input type="file" class="d-none" id="topluYukleInput" accept=".xlsx,.xls,.csv">
            </label>
            <a class="btn btn-outline-secondary btn-sm" href="/api/mera/rapor-indir"><i class="bi bi-file-earmark-spreadsheet me-1"></i><span id="txtRaporIndirBtn"></span></a>
            <span id="topluYukleSonuc" class="small align-self-center"></span>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-3"><select id="filtreIl" class="form-select form-select-sm"></select></div>
            <div class="col-md-2"><select id="filtreIlce" class="form-select form-select-sm"></select></div>
            <div class="col-md-2"><select id="filtreMahalle" class="form-select form-select-sm"></select></div>
            <div class="col-md-2"><button class="btn btn-primary btn-sm w-100" id="yeniParselBtn"></button></div>
            <div class="col-md-2"><input type="text" class="form-control form-control-sm" id="filtreArama"></div>
            <div class="col-md-1"><select id="filtreDurum" class="form-select form-select-sm"></select></div>
          </div>

          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle">
              <thead>
                <tr id="theadSatiri"></tr>
              </thead>
              <tbody id="parselTablosu"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <footer class="mis-footer" id="mis-footer"></footer>
  </div>

  <!-- Yeni Parsel Modalı -->
  <div class="modal fade" id="yeniParselModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="txtYeniParselBaslik"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="row g-2 mb-2">
            <div class="col-md-4"><select id="ypIl" class="form-select form-select-sm"></select></div>
            <div class="col-md-4"><select id="ypIlce" class="form-select form-select-sm"></select></div>
            <div class="col-md-4"><select id="ypMahalle" class="form-select form-select-sm"></select></div>
          </div>
          <div class="row g-2">
            <div class="col-md-6"><input class="form-control form-control-sm" id="ypAdaNo"></div>
            <div class="col-md-6"><input class="form-control form-control-sm" id="ypParselNo"></div>
          </div>
          <div id="ypSonuc" class="small mt-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" id="txtVazgecBtn"></button>
          <button type="button" class="btn btn-primary btn-sm" id="ypKaydetBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2/dist/js/tom-select.complete.min.js"></script>
  <script src="/assets/js/mis-menu.js?v=13"></script>
  <script src="/assets/js/shell.js?v=13"></script>
  <script src="/assets/js/mis-yer-secici.js?v=13"></script>
  <script src="/assets/js/mis-lang.js?v=1"></script>
  <script>
    function guvenliMetin(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

    let LANG = null;
    let _filtreIl = '', _filtreIlce = '', _filtreMahalle = '', _filtreDurum = 'Aktif', _filtreArama = '';

    function durumRozeti(yapildiMi) {
      return yapildiMi
        ? `<span class="badge bg-success-subtle text-success-emphasis mera-durum-rozet">${LANG.mera.yapildi}</span>`
        : '<span class="badge bg-secondary-subtle text-secondary-emphasis mera-durum-rozet">-</span>';
    }

    function parselDurumRozeti(durum) {
      const renkler = { Aktif: 'bg-success-subtle text-success-emphasis', Pasif: 'bg-warning-subtle text-warning-emphasis', Silindi: 'bg-danger-subtle text-danger-emphasis' };
      return `<span class="badge ${renkler[durum] || 'bg-secondary-subtle'} mera-durum-rozet">${guvenliMetin(durum)}</span>`;
    }

    async function parselleriYukle() {
      const params = new URLSearchParams();
      if (_filtreIl) params.set('il', _filtreIl);
      if (_filtreIlce) params.set('ilce', _filtreIlce);
      if (_filtreMahalle) params.set('koyMahalle', _filtreMahalle);
      if (_filtreDurum) params.set('durum', _filtreDurum);
      if (_filtreArama) params.set('arama', _filtreArama);
      const json = await fetch(`/api/mera?${params}`).then((r) => r.json());
      const govde = document.getElementById('parselTablosu');
      if (!json.success || !json.data.length) { govde.innerHTML = `<tr><td colspan="11" class="text-muted small">${LANG.ortak.kayitBulunamadi}</td></tr>`; return; }
      govde.innerHTML = json.data.map((p) => `
        <tr>
          <td>${guvenliMetin(p.il)}</td>
          <td>${guvenliMetin(p.ilce)}</td>
          <td>${guvenliMetin(p.koyMahalle)}</td>
          <td>${guvenliMetin(p.adaNo || '-')}</td>
          <td>${guvenliMetin(p.parselNo || '-')}</td>
          <td>${guvenliMetin(p.araziNiteligi || '-')}</td>
          <td>${durumRozeti(p.tespitYapildiMi)}</td>
          <td>${durumRozeti(p.tahditYapildiMi)}</td>
          <td>${durumRozeti(p.tahsisYapildiMi)}</td>
          <td>${parselDurumRozeti(p.durum)}</td>
          <td><a class="btn btn-sm btn-outline-primary" href="/mera/detay.html?id=${p._id}">${LANG.ortak.detay}</a></td>
        </tr>`).join('');
    }

    async function baslat() {
      LANG = await misLangYukle();

      document.getElementById('txtBaslikListe').textContent = LANG.mera.baslikListe;
      document.getElementById('txtAciklamaListe').textContent = LANG.mera.aciklamaListe;
      document.getElementById('txtSablonIndirBtn').textContent = LANG.mera.sablonIndirBtn;
      document.getElementById('txtTopluYukleBtn').textContent = LANG.mera.topluYukleBtn;
      document.getElementById('txtRaporIndirBtn').textContent = LANG.mera.raporIndirBtn;
      document.getElementById('yeniParselBtn').textContent = LANG.mera.yeniParselBtn;
      document.getElementById('txtYeniParselBaslik').textContent = LANG.mera.yeniParselBaslik;
      document.getElementById('ypAdaNo').placeholder = LANG.mera.adaNo;
      document.getElementById('ypParselNo').placeholder = LANG.mera.parselNo;
      document.getElementById('txtVazgecBtn').textContent = LANG.ortak.vazgec;
      document.getElementById('ypKaydetBtn').textContent = LANG.mera.olusturVeDevamEt;
      document.getElementById('theadSatiri').innerHTML = `
        <th>${LANG.ortak.il}</th><th>${LANG.ortak.ilce}</th><th>${LANG.ortak.mahalle}</th>
        <th>${LANG.mera.adaNo}</th><th>${LANG.mera.parselNo}</th><th>${LANG.mera.araziNiteligi}</th>
        <th>${LANG.mera.tespit}</th><th>${LANG.mera.tahdit}</th><th>${LANG.mera.tahsis}</th><th>${LANG.mera.durum}</th><th></th>`;
      document.getElementById('parselTablosu').innerHTML = `<tr><td colspan="11" class="text-muted small">${LANG.ortak.yukleniyor}</td></tr>`;

      document.getElementById('filtreDurum').innerHTML = ['Aktif', 'Pasif', 'Tümü'].map((d) => `<option value="${d}" ${d === 'Aktif' ? 'selected' : ''}>${d}</option>`).join('');
      document.getElementById('filtreDurum').addEventListener('change', (e) => { _filtreDurum = e.target.value; parselleriYukle(); });

      document.getElementById('filtreArama').placeholder = LANG.mera.aramaPlaceholder;
      let _aramaZamanlayici = null;
      document.getElementById('filtreArama').addEventListener('input', (e) => {
        clearTimeout(_aramaZamanlayici);
        _aramaZamanlayici = setTimeout(() => { _filtreArama = e.target.value.trim(); parselleriYukle(); }, 300);
      });

      misYerSeciciKur({
        ilSelectId: 'filtreIl', ilceSelectId: 'filtreIlce', mahalleSelectId: 'filtreMahalle',
        ilceOpsiyonel: true, mahalleOpsiyonel: true,
        onDegisti: ({ il, ilce, mahalle }) => { _filtreIl = il || ''; _filtreIlce = ilce || ''; _filtreMahalle = mahalle || ''; parselleriYukle(); },
      });

      document.getElementById('yeniParselBtn').addEventListener('click', () => {
        new bootstrap.Modal(document.getElementById('yeniParselModal')).show();
      });

      document.getElementById('topluYukleInput').addEventListener('change', async (e) => {
        const dosya = e.target.files[0];
        if (!dosya) return;
        const sonucAlan = document.getElementById('topluYukleSonuc');
        const formData = new FormData();
        formData.append('dosya', dosya);
        formData.append('kullaniciAdi', localStorage.getItem('meraKullaniciAdi') || '');

        sonucAlan.innerHTML = LANG.ortak.yukleniyor;
        const res = await fetch('/api/mera/toplu-yukle', { method: 'POST', body: formData });
        const json = await res.json();
        if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger">${json.message}</span>`; return; }
        sonucAlan.innerHTML = `<span class="text-success">${json.data.eklenen} eklendi, ${json.data.guncellenen} güncellendi (toplam ${json.data.toplam}).</span>`;
        parselleriYukle();
        e.target.value = '';
      });

      misYerSeciciKur({ ilSelectId: 'ypIl', ilceSelectId: 'ypIlce', mahalleSelectId: 'ypMahalle' });

      document.getElementById('ypKaydetBtn').addEventListener('click', async () => {
        const sonucAlan = document.getElementById('ypSonuc');
        const il = document.getElementById('ypIl').value;
        const ilce = document.getElementById('ypIlce').value;
        const koyMahalle = document.getElementById('ypMahalle').value;
        if (!il || !ilce || !koyMahalle) { sonucAlan.innerHTML = `<span class="text-danger">${LANG.mera.ilIlceMahalleSeciminZorunlu}</span>`; return; }

        sonucAlan.innerHTML = LANG.ortak.kaydediliyor;
        const res = await fetch('/api/mera', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ il, ilce, koyMahalle, adaNo: document.getElementById('ypAdaNo').value.trim(), parselNo: document.getElementById('ypParselNo').value.trim() }),
        });
        const json = await res.json();
        if (!json.success) { sonucAlan.innerHTML = `<span class="text-danger">${json.message}</span>`; return; }
        window.location.href = `/mera/detay.html?id=${json.data._id}`;
      });

      misKabuguBaslat('mera', `${LANG.mera.kisaAd}<span class="ayrac">/</span>${LANG.mera.modulAdi.replace('Mera ', '')}`);
      parselleriYukle();
    }

    baslat();
  </script>
</body>
</html>
